      <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab2" type="button" onclick="hks_khoiPhucTrangThaiGoc_fn(2)"><i class="bi bi-journal-check"></i> 2. Kết quả học tập & Thành tích</button></li>

<script>
let hks_khoDuLieuTong_arr = [];
  let hks_tienTrinhTaiDuLieu_promise = null; // [BẢN NÂNG CẤP]: Cờ theo dõi tiến trình API chống gọi lặp

  async function hks_thucThiGiaoTiep_fn(hks_lenhDieuPhoi_str, hks_goiDuLieu_obj = {}) {
      hks_goiDuLieu_obj.hks_lenhKichHoat_str = hks_lenhDieuPhoi_str;
      try {
          const hks_phanHoiNhanCung_obj = await fetch(HKS_CAU_HINH_WEBAPP_STR, {
              method: 'POST',
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify(hks_goiDuLieu_obj)
          });
          return await hks_phanHoiNhanCung_obj.json();
      } catch (hks_loiNgoaiLe_obj) {
          console.error("Lỗi gốc:", hks_loiNgoaiLe_obj);
          throw new Error("Internet yếu. Hãy đăng nhập lại!");
      }
  }

  async function hks_capNhatBoNhoDem_fn() {
      // [BẢN NÂNG CẤP]: Thuật toán Singleton Promise - Nếu đang tải, trả về luôn Promise đang chạy để các lệnh khác await cùng, tuyệt đối không tạo thêm request mới.
      if (hks_tienTrinhTaiDuLieu_promise) return hks_tienTrinhTaiDuLieu_promise;
      
      hks_tienTrinhTaiDuLieu_promise = hks_thucThiGiaoTiep_fn('hks_taiToanBoThucThe_api', {hks_dinhTuyenNguon_str: hks_hoSoNguoiDungHienTai_obj.reqId})
          .then(res => {
              if (res.success) hks_khoDuLieuTong_arr = res.data;
              return res;
          })
          .catch(e => { 
              console.error("Lỗi đệm:", e); 
              hks_tienTrinhTaiDuLieu_promise = null; // Mở khóa nếu lỗi
              throw e; 
          });
          
      return hks_tienTrinhTaiDuLieu_promise;
  }

  let hks_tooltip_timer;
  function hks_showTooltip(el, encodedHtml) { 
      clearTimeout(hks_tooltip_timer); let tooltip = document.getElementById('global-tooltip'); tooltip.innerHTML = decodeURIComponent(encodedHtml); tooltip.style.display = 'block';
      let rect = el.getBoundingClientRect(); let tooltipRect = tooltip.getBoundingClientRect();
      let topPos = rect.bottom + 5; let leftPos = rect.left + (rect.width / 2) - (tooltipRect.width / 2);
      if (leftPos < 10) leftPos = 10; if (leftPos + tooltipRect.width > window.innerWidth - 10) leftPos = window.innerWidth - tooltipRect.width - 20;
      if (topPos + tooltipRect.height > window.innerHeight - 10) topPos = rect.top - tooltipRect.height - 5;
      tooltip.style.top = topPos + 'px'; tooltip.style.left = leftPos + 'px';
  }
  function hks_hideTooltip() { hks_tooltip_timer = setTimeout(() => { document.getElementById('global-tooltip').style.display = 'none'; }, 150); }
  function hks_keepTooltip() { clearTimeout(hks_tooltip_timer); }

  let hks_bienKhungHeThong_obj = {};
  let hks_trangThaiSuaMot_bol = false;
  let hks_trangThaiSuaHai_bol = false;
  let hks_hoSoNguoiDungHienTai_obj = null;

  function hks_hienThiManHinhTai_fn(hks_trangThai_bol) { document.getElementById('instant-loader').style.display = hks_trangThai_bol ? 'flex' : 'none'; }
  
  function hks_xuLyPhanHoiDangNhap_fn(hks_phanHoiGG_obj) {
      hks_hienThiManHinhTai_fn(true);
      const hks_chuoiGiaoTiep_str = hks_phanHoiGG_obj.credential;

      hks_thucThiGiaoTiep_fn('hks_khoiDongChuongTrinh_api', {hks_chuoiDinhDanh_str: hks_chuoiGiaoTiep_str, hks_maXacThuc_str: ""}).then(hks_ketQuaAPI_obj => {
          if(!hks_ketQuaAPI_obj.success) { 
              hks_hienThiManHinhTai_fn(false); sessionStorage.removeItem("sys_data_hs");
              Swal.fire({ title: "Từ chối truy cập", text: hks_ketQuaAPI_obj.message, icon: "error", confirmButtonText: "Quay lại trang chủ", allowOutsideClick: false }).then((res) => { if (res.isConfirmed) location.reload(); });
              return; 
          }
          
          hks_hoSoNguoiDungHienTai_obj = hks_ketQuaAPI_obj.data;
          hks_bienKhungHeThong_obj = hks_ketQuaAPI_obj.config;
          
          sessionStorage.setItem("sys_data_hs", JSON.stringify(hks_hoSoNguoiDungHienTai_obj));
          sessionStorage.setItem("sys_config_hs", JSON.stringify(hks_bienKhungHeThong_obj));

          hks_doDuLieuVaoHopChon_fn();
          hks_thietLapBoLoc_fn();
          hks_kiemTraQuyenVaNapTabBon_fn(); 
          
          if (typeof hks_kiemTraQuyenXuatNhapExcel_fn === 'function') { hks_kiemTraQuyenXuatNhapExcel_fn(); }

          document.getElementById('profile-display').innerText = hks_hoSoNguoiDungHienTai_obj.name; 
          document.getElementById('role-badge').innerText = hks_hoSoNguoiDungHienTai_obj.role === 'admin' ? 'Super Admin' : 'Giáo viên';
          document.getElementById('gate-overlay').style.display = 'none'; 
          
          let hks_ungDungChinh_el = document.getElementById('main-app');
          hks_ungDungChinh_el.style.display = 'block'; 
          setTimeout(() => { hks_ungDungChinh_el.style.opacity = '1'; }, 50);

  function hks_dangXuatTaiKhoan_fn() { 
      hks_hoSoNguoiDungHienTai_obj = null;

      sessionStorage.removeItem("sys_data_hs");

  function hks_doDuLieuVaoHopChon_fn() {
    ['t1_nam','t1_lop','t2_nam','t2_lop','t3_nam', 't3_tunam', 't3_dennam', 't5_nam', 't5_lop'].forEach(id => {
      let hks_phanTuUI_el = document.getElementById(id);
      if (hks_phanTuUI_el) { 
          hks_phanTuUI_el.innerHTML = '<option value="">--</option>';
          let hks_loaiTruong_str = id.includes('nam') ? 'hks_chuKyHoatDong_arr' : 'hks_phomPhanLoai_arr';
          let tapDuLieu = hks_bienKhungHeThong_obj[hks_loaiTruong_str] || [];
          tapDuLieu.forEach(val => { let hks_tuyChonUI_el = document.createElement('option'); hks_tuyChonUI_el.value = val; hks_tuyChonUI_el.text = val; hks_phanTuUI_el.add(hks_tuyChonUI_el); });
      }
    });
  }

  function hks_thietLapBoLoc_fn() {
    ['t1_nam', 't1_lop', 't1_cccd', 't1_hodem', 't1_ten'].forEach(id => { 
        let e = document.getElementById(id); 
        if (e) { 
            e.addEventListener('input', () => hks_lamSachBangHienThi_fn(1)); 
            e.addEventListener('change', () => hks_lamSachBangHienThi_fn(1)); 
            if(e.tagName === 'INPUT') { e.addEventListener('keydown', (ev) => { if(ev.key === 'Enter') hks_layDuLieuPhanMot_fn(); }); } 
        } 
    });
    
    ['t2_nam', 't2_lop', 't2_cccd', 't2_hodem', 't2_ten'].forEach(id => { 
        let e = document.getElementById(id); 
        if (e) { 
            e.addEventListener('input', () => hks_lamSachBangHienThi_fn(2)); 
            e.addEventListener('change', () => hks_lamSachBangHienThi_fn(2)); 
            if(e.tagName === 'INPUT') { e.addEventListener('keydown', (ev) => { if(ev.key === 'Enter') { if(typeof hks_layDuLieuPhanHai_fn === 'function') hks_layDuLieuPhanHai_fn(); } }); } 
        } 
    });
    
    ['t5_nam', 't5_lop', 't5_cccd', 't5_hodem', 't5_ten'].forEach(id => { 
        let e = document.getElementById(id); 
        if (e) { 
            e.addEventListener('input', () => hks_lamSachBangHienThi_fn(5)); 
            e.addEventListener('change', () => hks_lamSachBangHienThi_fn(5)); 
            if(e.tagName === 'INPUT') { e.addEventListener('keydown', (ev) => { if(ev.key === 'Enter') { if(typeof hks_layDuLieuPhanNam_fn === 'function') hks_layDuLieuPhanNam_fn(); } }); } 
        } 
    });
  }

  function hks_lamSachBangHienThi_fn(hks_chiSoThe_num) {
      let b = document.querySelector(`#bang${hks_chiSoThe_num} tbody`); if(b) b.innerHTML = '';
      let btnE = document.getElementById(`btnEdit${hks_chiSoThe_num}`); if(btnE) btnE.style.display = 'none';
      let grp = document.getElementById(`groupEdit${hks_chiSoThe_num}`); if(grp) grp.style.display = 'none';
      if(hks_chiSoThe_num === 1) hks_trangThaiSuaMot_bol = false;
      if(hks_chiSoThe_num === 2) hks_trangThaiSuaHai_bol = false;
  }

  function hks_kichHoatChinhSua_fn(hks_chiSoThe_num) {
    if(hks_chiSoThe_num === 1) {
       hks_trangThaiSuaMot_bol = true; document.getElementById('btnEdit1').style.display = 'none'; document.getElementById('groupEdit1').style.display = 'inline-block';
       let tapQuyen = hks_bienKhungHeThong_obj.hks_tapQuyenSuDung_arr || [];
       let hks_laQuanTriCapCao_bol = tapQuyen.includes('ALL');
       document.getElementById('btnChuyenLop').style.display = hks_laQuanTriCapCao_bol ? 'inline-block' : 'none'; hks_dieuKhienOVuong_fn('#bang1', false);
    } else {
       hks_trangThaiSuaHai_bol = true; document.getElementById('btnEdit2').style.display = 'none'; document.getElementById('groupEdit2').style.display = 'inline-block'; hks_dieuKhienOVuong_fn('#bang2', false);
    }
  }

function hks_khoiPhucTrangThaiGoc_fn(hks_chiSoThe_num) {
    let namEl = document.getElementById(`t${hks_chiSoThe_num}_nam`); 
    let lopEl = document.getElementById(`t${hks_chiSoThe_num}_lop`);
    if(!namEl || !lopEl) return;
    
    let hks_khoaChon_str = `${namEl.value}_${lopEl.value}`;
    let tapQuyen = hks_bienKhungHeThong_obj.hks_tapQuyenSuDung_arr || [];
    let hks_laQuanTriCapCao_bol = tapQuyen.includes('ALL');
    let hks_coQuyenSua_bol = hks_laQuanTriCapCao_bol || tapQuyen.includes(hks_khoaChon_str);
    let hks_nutSuaUI_el = document.getElementById(`btnEdit${hks_chiSoThe_num}`);
    
    if(hks_chiSoThe_num === 1) { 
        if (hks_nutSuaUI_el) hks_nutSuaUI_el.style.display = hks_coQuyenSua_bol ? 'inline-block' : 'none';
        
        // TỐI ƯU: Chỉ chạy lệnh quét DOM (khôi phục ô vuông) nếu đang ở trạng thái Sửa
        if (hks_trangThaiSuaMot_bol) {
            hks_trangThaiSuaMot_bol = false; 
            let groupEdit = document.getElementById('groupEdit1');
            if (groupEdit) groupEdit.style.display = 'none'; 
            
            // Đẩy lệnh điều khiển vào luồng ngầm định, tránh giật lag khi chuyển Tab
            setTimeout(() => { hks_dieuKhienOVuong_fn('#bang1', true); }, 100);
        } 
    } 
    else if(hks_chiSoThe_num === 2) { 
        if (hks_nutSuaUI_el) hks_nutSuaUI_el.style.display = hks_coQuyenSua_bol ? 'inline-block' : 'none';
        
        if (hks_trangThaiSuaHai_bol) {
            hks_trangThaiSuaHai_bol = false; 
            let groupEdit = document.getElementById('groupEdit2');
            if (groupEdit) groupEdit.style.display = 'none'; 
            
            setTimeout(() => { hks_dieuKhienOVuong_fn('#bang2', true); }, 100);
        }
    }
  }

 function hks_dieuKhienOVuong_fn(hks_danhDauBang_str, hks_voHieuHoa_bol) {
    const b = document.querySelector(hks_danhDauBang_str); if(!b) return;
    let hks_laQuanTriCapCao_bol = (hks_bienKhungHeThong_obj && hks_bienKhungHeThong_obj.hks_quyenTuyetDoi_bol === true);
    b.querySelectorAll('input, select').forEach(el => {
       if (hks_voHieuHoa_bol) { el.disabled = true; } else {
           if (hks_laQuanTriCapCao_bol) { el.disabled = false; } else {
               if (hks_danhDauBang_str === '#bang1') { el.disabled = false; } else {
                   let n = el.name || "";
                   if (n.startsWith('tt_')) { el.disabled = false; } 
                   else if (n.startsWith('kq_')) { try { let hs = b.querySelectorAll(`input[name="${n}"]`); el.disabled = Boolean(Array.from(hs).some(e => e.checked)); } catch(e) { el.disabled = Boolean(el.checked); } } 
                   else { el.disabled = Boolean(el.type === 'checkbox' ? el.checked : el.value && String(el.value).trim() !== ""); }
               }
           }
       }
    });
    b.querySelectorAll('.bi-x-circle-fill, .btn-xoa-nguon').forEach(btn => { let ok = !hks_voHieuHoa_bol; if (!hks_laQuanTriCapCao_bol && hks_danhDauBang_str !== '#bang1') ok = false; btn.style.display = ok ? 'inline-block' : 'none'; });
    if (hks_laQuanTriCapCao_bol && hks_danhDauBang_str === '#bang1') { b.querySelectorAll('.stt-label').forEach(lbl => { lbl.style.display = hks_voHieuHoa_bol ? 'inline-block' : 'none'; }); }
  }

  function hks_kiemTraQuyenVaNapTabBon_fn() {
    $('#nav-li-tab4').remove();
    $('#tab4').remove();
    
    if (hks_hoSoNguoiDungHienTai_obj && hks_hoSoNguoiDungHienTai_obj.role === 'admin') {
      $('#bangDieuKhien').append(`
        <li class="nav-item" id="nav-li-tab4">
          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab4" type="button" onclick="hks_taiDuLieuPhanBon_fn()">
            <i class="bi bi-shield-lock"></i> 5. Phân quyền hệ thống
          </button>
        </li>
      `);
      $.get("Tab4.html", function(hks_giaoDienTab4_str) {
        $("#khung-chua-tab").append(hks_giaoDienTab4_str);
      });
    }
  }

  function hks_taiDuLieuPhanBon_fn() {
    if (!hks_bienKhungHeThong_obj) {
        Swal.fire("Thông báo", "Dữ liệu cấu hình chưa sẵn sàng, vui lòng tải lại trang!", "info");
        return;
    }

    Swal.fire({
        title: 'Đang tải cấu hình...',
        text: 'Vui lòng chờ trong giây lát',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
    });

    setTimeout(() => {
        document.getElementById('t4_danToc').value = (hks_bienKhungHeThong_obj.hks_rawDanToc_arr || []).join(', ');
        document.getElementById('t4_xepLoai').value = (hks_bienKhungHeThong_obj.hks_rawXepLoai_arr || []).join(', ');
        document.getElementById('t4_capThanhTich').value = (hks_bienKhungHeThong_obj.hks_rawCapThanhTich_arr || []).join(', ');
        document.getElementById('t4_toanQuyen').value = (hks_bienKhungHeThong_obj.hks_rawToanQuyen_arr || []).join(', ');

        let tbody = document.getElementById('tbodyPhanQuyen');
        if (tbody) {
            tbody.innerHTML = '';
            (hks_bienKhungHeThong_obj.hks_rawPhanQuyen_arr || []).forEach(item => {
                let tr = document.createElement('tr');
                let radioName = 'radio_' + Math.random().toString(36).substr(2, 6);
                tr.innerHTML = `
                    <td><input type="text" class="cell-input text-center hks-nam-hoc" value="${item.namHoc || ''}" placeholder="VD: 2026-2027"></td>
                    <td><input type="text" class="cell-input text-center hks-lop" value="${item.lop || ''}" placeholder="VD: 1A"></td>
                    <td class="text-center align-middle">
                        <input class="form-check-input hks-kich-hoat" type="radio" name="${radioName}" ${item.kichHoat === 'x' ? 'checked' : ''}>
                    </td>
                    <td><input type="text" class="cell-input hks-dinh-danh" value="${item.dinhDanh || ''}" placeholder="Cán bộ phụ trách..."></td>
                    <td class="text-center align-middle">
                        <i class="bi bi-x-circle-fill text-danger hks-input-thanhtich" onclick="this.closest('tr').remove()" title="Thu hồi cấu hình"></i>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        let hks_trangThaiLuu_str = localStorage.getItem('sys_toggle_khoa_t4');
        let hks_nutGatUI_el = document.getElementById('t4_toggleKhoa');
        if (hks_nutGatUI_el) {
            if (hks_trangThaiLuu_str === 'khoa') {
                hks_nutGatUI_el.checked = false;
                if(typeof hks_xuLyKhoaCapNhat_fn === 'function') hks_xuLyKhoaCapNhat_fn(hks_nutGatUI_el);
            } else {
                hks_nutGatUI_el.checked = true;
                if(typeof hks_xuLyKhoaCapNhat_fn === 'function') hks_xuLyKhoaCapNhat_fn(hks_nutGatUI_el);
            }
        }
        Swal.close();
    }, 200);
  }

  function hks_themDongPhanQuyen_fn() {
      let tbody = document.getElementById('tbodyPhanQuyen');
      if (!tbody) return;
      let tr = document.createElement('tr');
      let radioName = 'radio_' + Math.random().toString(36).substr(2, 6);
      
      let hks_trangThaiKhoa_bol = !document.getElementById('t4_toggleKhoa').checked;
      let hks_thuocTinhDisabled_str = hks_trangThaiKhoa_bol ? 'disabled' : '';

      tr.innerHTML = `
          <td><input type="text" class="cell-input text-center hks-nam-hoc" placeholder="VD: 2026-2027"></td>
          <td><input type="text" class="cell-input text-center hks-lop" placeholder="VD: 1A"></td>
          <td class="text-center align-middle">
              <input class="form-check-input hks-kich-hoat" type="radio" name="${radioName}" ${hks_thuocTinhDisabled_str}>
          </td>
          <td><input type="text" class="cell-input hks-dinh-danh" placeholder="Cán bộ phụ trách..."></td>
          <td class="text-center align-middle">
              <i class="bi bi-x-circle-fill text-danger hks-input-thanhtich" onclick="this.closest('tr').remove()" title="Thu hồi cấu hình"></i>
          </td>
      `;
      tbody.appendChild(tr);

      let hks_khungCuon_el = tbody.closest('.table-container');
      if (hks_khungCuon_el) hks_khungCuon_el.scrollTop = hks_khungCuon_el.scrollHeight;
      
      setTimeout(() => {
          let hks_oNhapNamHoc_el = tr.querySelector('.hks-nam-hoc');
          if (hks_oNhapNamHoc_el) hks_oNhapNamHoc_el.focus();
      }, 100);
  }

  function hks_luuCauHinhPhanBon_fn() {
    Swal.fire({
        title: "Xác nhận lưu cấu hình?",
        text: "Hệ thống sẽ tái cấu trúc ma trận phân quyền và thiết lập lại toàn bộ danh mục!",
        icon: "warning",
        showCancelButton: true,
        confirmButtonColor: "#003366",
        cancelButtonColor: "#dc3545",
        confirmButtonText: "Đồng ý ghi nhận",
        cancelButtonText: "Hủy bỏ"
    }).then((result) => {
        if (result.isConfirmed) {
            hks_hienThiManHinhTai_fn(true);
            
            let hks_mangPhanQuyen_arr = [];
            document.querySelectorAll('#tbodyPhanQuyen tr').forEach(tr => {
                let namHoc = tr.querySelector('.hks-nam-hoc').value.trim();
                let lop = tr.querySelector('.hks-lop').value.trim();
                let kichHoat = tr.querySelector('.hks-kich-hoat').checked ? 'x' : '';
                let dinhDanh = tr.querySelector('.hks-dinh-danh').value.trim();
                
                if (namHoc || lop) {
                    hks_mangPhanQuyen_arr.push({ namHoc, lop, kichHoat, dinhDanh });
                }
            });
            
            let hks_goiCauHinh_obj = {
                hks_danToc_str: document.getElementById('t4_danToc').value.trim(),
                hks_xepLoai_str: document.getElementById('t4_xepLoai').value.trim(),
                hks_capThanhTich_str: document.getElementById('t4_capThanhTich').value.trim(),
                hks_toanQuyen_str: document.getElementById('t4_toanQuyen').value.trim(),
                hks_danhSachPhanQuyen_arr: hks_mangPhanQuyen_arr
            };
            
            hks_thucThiGiaoTiep_fn('hks_ghiNhanPhanHeBon_api', {
                hks_dinhTuyenNguon_str: hks_hoSoNguoiDungHienTai_obj.reqId,
                hks_goiCauHinh_obj: hks_goiCauHinh_obj
            }).then(res => {
                hks_hienThiManHinhTai_fn(false);
                if (res.success) {
                    Swal.fire("Thành công", res.message, "success").then(() => {
                        sessionStorage.removeItem("sys_config_hs");
                        location.reload(); 
                    });
                } else {
                    Swal.fire("Lỗi phân quyền", res.message, "error");
                }
            }).catch(e => {
                hks_hienThiManHinhTai_fn(false);
                Swal.fire("Lỗi kết nối", e.message, "error");
            });
        }
    });
  }

  function chuyenHuongHeThong() {
      var urlDich = (typeof HKS_LINK_TRANG_CHU !== 'undefined' && HKS_LINK_TRANG_CHU.trim() !== '') 
                    ? HKS_LINK_TRANG_CHU 
                    : 'https://gdlaocailci.github.io/thlevantam/';
                    
      window.open(urlDich, '_top');
  }
  
  function khoaTruyCapMaNguon() {
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); }
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.keyCode === 73)) { e.preventDefault(); }
            if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j' || e.keyCode === 74)) { e.preventDefault(); }
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u' || e.keyCode === 85)) { e.preventDefault(); }
            if (e.ctrlKey && (e.key === 'S' || e.key === 's' || e.keyCode === 83)) { e.preventDefault(); }
        });
    }
    khoaTruyCapMaNguon();
</script>
