<script>
    let dsCanbgv = []; let tdtaiXoaCho = null; let ptuChoXoa = null;

    // =========================================================================
    // NÂNG CẤP CỐT LÕI: BỘ ĐIỀU PHỐI HÀNG ĐỢI & TỰ ĐỘNG THỬ LẠI (AUTO-RETRY)
    // Khắc phục triệt để lỗi "Failed to fetch" / "LỖI GIAO TIẾP DỮ LIỆU" do nghẽn
    // kết nối đồng thời tới Google Apps Script khi tải ngầm nhiều hồ sơ.
    // =========================================================================
    (function gvNangCapKetNoiChongNghen() {
        if (typeof window.khachApi === 'undefined' || window.khachApi._daNangCapChongNghen) return;
        window.khachApi._daNangCapChongNghen = true;

        let dangChay = 0;
        const TOI_DA_DONG_THOI = 2; // Giới hạn tối đa 2 luồng gọi GAS cùng lúc để không bị Google chặn CORS
        const hangDoi = [];
        let cacheDsCanbTam = null;
        let thoiDiemCacheCanb = 0;

        function chayTiepHangDoi() {
            while (dangChay < TOI_DA_DONG_THOI && hangDoi.length > 0) {
                const tacVu = hangDoi.shift();
                dangChay++;
                tacVu().finally(() => {
                    dangChay--;
                    chayTiepHangDoi();
                });
            }
        }

        window.khachApi.yeucauApi = function(hdong, tdtai, khiTcong, khiLoi) {
            if (typeof ddungApi === 'undefined' || !ddungApi) {
                if (khiLoi) khiLoi(new Error("Liên kết API hệ thống chưa sẵn sàng. Vui lòng tải lại trang."));
                return;
            }

            // Dùng chung kết quả gvlaydscanb trong 15 giây đầu để tránh gọi trùng lặp giữa index.html và Tab Giao việc
            if (hdong === "gvlaydscanb" && cacheDsCanbTam && (Date.now() - thoiDiemCacheCanb < 15000)) {
                if (khiTcong) setTimeout(() => khiTcong(cacheDsCanbTam), 10);
                return;
            }

            const laUuTienCao = (hdong === "gvxulynviec" || hdong === "gvlaydlbdau" || hdong === "gvlaydscanb" || hdong === "luutam" || hdong === "nopbcao");

            const thucThiFetch = () => new Promise((resolve) => {
                const dlieu = { hdong: hdong, token: window.PGV_TOKEN || "", ...tdtai };
                const urlFetch = ddungApi + (ddungApi.includes('?') ? '&' : '?') + 'hdong=' + encodeURIComponent(hdong);

                const goiThu = (lanThu) => {
                    fetch(urlFetch, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(dlieu),
                        redirect: 'follow'
                    })
                    .then(function(ph) {
                        if (!ph.ok) throw new Error("Máy chủ bận (Mã: " + ph.status + ")");
                        return ph.text();
                    })
                    .then(function(txt) {
                        let kq;
                        try {
                            kq = JSON.parse(txt);
                        } catch (e) {
                            throw new Error("Phản hồi máy chủ gián đoạn (" + e.message + ")");
                        }

                        // Tự động ẩn thông báo lỗi #hopLoi trên màn hình chính ngay khi kết nối thông suốt
                        const hopLoi = document.getElementById('hopLoi');
                        if (hopLoi && hopLoi.style.display !== 'none') {
                            hopLoi.style.display = 'none';
                        }

                        if (kq.ttai === 'loi') {
                            if (khiLoi) khiLoi(new Error(kq.tbao));
                        } else {
                            const dcuoi = (kq.dliu !== undefined) ? kq.dliu : kq;
                            if (hdong === "gvlaydscanb" && Array.isArray(dcuoi)) {
                                cacheDsCanbTam = dcuoi;
                                thoiDiemCacheCanb = Date.now();
                            }
                            if (khiTcong) khiTcong(dcuoi);
                        }
                        resolve();
                    })
                    .catch(function(loie) {
                        // Tự động thử lại tối đa 3 lần nếu gặp lỗi "Failed to fetch" hoặc nghẽn mạng tạm thời
                        if (lanThu < 3) {
                            setTimeout(() => goiThu(lanThu + 1), 650 * lanThu);
                        } else {
                            if (khiLoi) khiLoi(loie);
                            resolve();
                        }
                    });

    // Hàm hiển thị Modal UI thay vì toast
    function gvTbaoNhanh(loai, tb, callback = null) {
        let icon = '';
        let iconClass = '';
        let title = '';
        let btnText = 'Đóng';
        let btnClass = 'gv-modal-btn-primary';
        
        switch(loai) {
            case 'tc':
                icon = '✓';
                iconClass = 'gv-modal-icon-success';
                title = 'THÀNH CÔNG';
                btnClass = 'gv-modal-btn-success';
                break;
            case 'loi':
                icon = '✗';
                iconClass = 'gv-modal-icon-error';
                title = 'LỖI';
                btnClass = 'gv-modal-btn-danger';
                break;
            case 'cbh':
                icon = '⚠';
                iconClass = 'gv-modal-icon-warning';
                title = 'CẢNH BÁO';
                btnClass = 'gv-modal-btn-primary';
                break;
            default:
                icon = 'ℹ';
                iconClass = 'gv-modal-icon-info';
                title = 'THÔNG BÁO';
        }
        
        const oldModal = document.querySelector('.gv-modal-overlay');
        if (oldModal) oldModal.remove();
        
        const modalOverlay = document.createElement('div');
        modalOverlay.className = 'gv-modal-overlay';
        modalOverlay.innerHTML = `
            <div class="gv-modal">
                <div class="gv-modal-header">
                    <div class="gv-modal-icon ${iconClass}">${icon}</div>
                    <div class="gv-modal-title">${title}</div>
                </div>
                <div class="gv-modal-body">
                    ${tb}
                </div>
                <div class="gv-modal-footer">
                    <button class="gv-modal-btn ${btnClass}">${btnText}</button>
                </div>
            </div>
        `;
        
        document.body.appendChild(modalOverlay);
        
        const closeModal = () => {
            modalOverlay.remove();
            if (callback && typeof callback === 'function') callback();
        };
        
        const btn = modalOverlay.querySelector('.gv-modal-btn');
        if (btn) btn.addEventListener('click', closeModal);
        
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) closeModal();
        });
    }

    // (Ưu tiên lấy từ window.PGV_ID_TC để không bị nhảy tên khi Quản trị viên chọn xem giáo viên khác ở Tab Nhiệm vụ)
    function gvLayThongTinNguoiDangNhap() {
        let id = "";
        let ten = "";
        let taik = "";
        let quyen = "";

        if (typeof window.PGV_ID_TC !== 'undefined' && window.PGV_ID_TC) {
            taik = String(window.PGV_ID_TC).trim().toLowerCase();
        }
        if (typeof window.PGV_QUYEN !== 'undefined' && window.PGV_QUYEN) {
            quyen = String(window.PGV_QUYEN).trim().toLowerCase();
        }

        // 1. Tra cứu trực tiếp theo email đăng nhập thực (window.PGV_ID_TC) trong dsCanbgv
        if (taik && dsCanbgv && Array.isArray(dsCanbgv)) {
            let foundByEmail = dsCanbgv.find(s => s && s.taik && String(s.taik).trim().toLowerCase() === taik);
            if (foundByEmail) {
                id = String(foundByEmail.ttrg || "").trim();
                ten = String(foundByEmail.tenn || "").trim();
                if (!quyen && foundByEmail.quyen) quyen = String(foundByEmail.quyen).trim().toLowerCase();
            }
        }

        // 2. Dự phòng lấy từ canbHientai.canb hoặc canbHientai nếu là chính chủ đang đăng nhập
        if (typeof canbHientai !== 'undefined' && canbHientai) {
            if (!quyen && canbHientai.quyen) quyen = String(canbHientai.quyen).trim().toLowerCase();
            const cbObj = canbHientai.canb || canbHientai;
            const cbEmail = String(cbObj.taik || "").trim().toLowerCase();
            if (!taik || cbEmail === taik) {
                if (!id && cbObj.ttrg) id = String(cbObj.ttrg).trim();
                if (!ten && cbObj.tenn) ten = String(cbObj.tenn).trim();
                if (!taik && cbEmail) taik = cbEmail;
            }
        }

        // 3. Đối chiếu bổ sung với dsCanbgv nếu mới có tên hoặc mới có ID
        if ((!id || !ten) && dsCanbgv && Array.isArray(dsCanbgv)) {
            let found = dsCanbgv.find(s =>
                (id && s.ttrg && String(s.ttrg).trim().toLowerCase() === id.toLowerCase()) ||
                (ten && s.tenn && String(s.tenn).trim().toLowerCase() === ten.toLowerCase())
            );
            if (found) {
                if (!id) id = String(found.ttrg || "").trim();
                if (!ten) ten = String(found.tenn || "").trim();
            }
        }

        let hienThi = "";
        if (ten && id) hienThi = `${ten} (${id})`;
        else if (ten) hienThi = ten;
        else if (id) hienThi = id;
        else hienThi = taik || "";

        return { id: id, ten: ten, taik: taik, quyen: quyen, hienThi: hienThi };
    }

    // Hàm tiện ích: Bóc tách thông tin Người giao từ chuỗi Ghi chú ("Người giao: Họ tên (ID): (...)")
    function gvTrichXuatNguoiGiaoTuGhiChu(chuoiGhiChu) {
        let raw = String(chuoiGhiChu || "").trim();
        let m = raw.match(/^Người\s*giao\s*:\s*(.+?)\s*(?::\s*\(([\s\S]*)\)|-\s*SL\s*:\s*(.*))$/i);
        if (!m) return { coNguoiGiao: false, id: "", ten: "", hienThi: "", phanNguoiNhan: raw };
        let cumNgGiao = m[1].trim();
        let phanNgNhan = String(m[2] !== undefined ? m[2] : (m[3] || "")).trim();
        let mId = cumNgGiao.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
        if (mId) {
            return {
                coNguoiGiao: true,
                ten: mId[1].trim(),
                id: mId[2].trim(),
                hienThi: cumNgGiao,
                phanNguoiNhan: phanNgNhan
            };
        }
        return {
            coNguoiGiao: true,
            ten: cumNgGiao,
            id: "",
            hienThi: cumNgGiao,
            phanNguoiNhan: phanNgNhan
        };
    }

    // Hàm tiện ích: Kiểm tra xem một dòng nhiệm vụ có phải do người khác giao hay không (Người A không được xóa/sửa của Người B)
    function gvLaGiaoViecCuaNguoiKhac(chuoiGhiChu) {
        const ttGiao = gvTrichXuatNguoiGiaoTuGhiChu(chuoiGhiChu);
        if (!ttGiao.coNguoiGiao) return { biKhoa: false, chuSoHuu: "" };
        const ngDangNhap = gvLayThongTinNguoiDangNhap();
        // Quản trị VIP (xxx) có toàn quyền quản lý
        if (ngDangNhap.quyen === 'xxx') {
            return { biKhoa: false, chuSoHuu: ttGiao.hienThi };
        }
        const idGiao = String(ttGiao.id || "").trim().toLowerCase();
        const tenGiao = String(ttGiao.ten || "").trim().toLowerCase();
        const idHt = String(ngDangNhap.id || "").trim().toLowerCase();
        const tenHt = String(ngDangNhap.ten || "").trim().toLowerCase();

        if (idGiao !== "" && idHt !== "") {
            return { biKhoa: idGiao !== idHt, chuSoHuu: ttGiao.hienThi };
        }
        if (tenGiao !== "" && tenHt !== "") {
            return { biKhoa: tenGiao !== tenHt, chuSoHuu: ttGiao.hienThi };
        }
        return { biKhoa: false, chuSoHuu: ttGiao.hienThi };
    }

    // Hàm tiện ích: Tạo chuỗi Ghi chú chuẩn gọn nhẹ chỉ gồm Họ tên + ID người giao và số lượng người nhận
    function gvTaoChuoiGhiChuChuan(dsNguoiChon, laToanTruong, chuoiGhiChuCu = "") {
        const ttCu = gvTrichXuatNguoiGiaoTuGhiChu(chuoiGhiChuCu);
        const ngDangNhap = gvLayThongTinNguoiDangNhap();
        const dinhDanhNgGiao = (ttCu.coNguoiGiao && ttCu.hienThi)
            ? ttCu.hienThi
            : (ngDangNhap.hienThi || "Người giao");

        if (laToanTruong) {
            const tongSo = gvLayDsGiaoVienHopLe().length;
            return `Người giao: ${dinhDanhNgGiao}: (Toàn trường - ${tongSo} người)`;
        }
        const soLuong = Array.isArray(dsNguoiChon) ? dsNguoiChon.length : 0;
        if (soLuong <= 0) return "";
        return `Người giao: ${dinhDanhNgGiao}: (${soLuong} người)`;
    }

    // Hàm tiện ích: Lấy danh sách nhân sự (Tất cả, không phân quyền, loại trừ chính người đang giao)
    function gvLayDsGiaoVienHopLe() {
        if (!dsCanbgv || !Array.isArray(dsCanbgv)) return [];
        
        // Lấy thông tin người đang thực hiện giao việc hiện tại
        const ngDangNhap = gvLayThongTinNguoiDangNhap();
        const idNguoiGiao = String(ngDangNhap.id || "").trim().toLowerCase();
        const emailNguoiGiao = String(ngDangNhap.taik || "").trim().toLowerCase();

        return dsCanbgv.filter(s => {
            if (!s || !s.ttrg) return false;
            
            let idCb = String(s.ttrg || "").trim().toLowerCase();
            let emailCb = String(s.taik || "").trim().toLowerCase();
            
            // 👉 LOẠI TRỪ CHÍNH NGƯỜI ĐANG GIAO VIỆC (So khớp theo cả ID và Email)
            if (idNguoiGiao && idCb === idNguoiGiao) return false;
            if (emailNguoiGiao && emailCb === emailNguoiGiao) return false;
            
            // 👉 LẤY TẤT CẢ CÁC NHÂN SỰ CÒN LẠI (Không phân biệt quyền thường, x, xx, xxx hay gs)
            return true;
        });
    }

    // Hàm tiện ích: Bóc tách chuỗi tên/ID từ dữ liệu dòng thành danh sách giáo viên đã chọn (Tách riêng phần Người giao và bỏ qua cụm số lượng)
    function gvPhanTichNguoiNhan(chuoiNgNhan, chuoiGhiChu = "") {
        let rawNg = String(chuoiNgNhan || "").trim();
        let rawGc = String(chuoiGhiChu || "").trim();
        const ttGiao = gvTrichXuatNguoiGiaoTuGhiChu(rawGc);
        let phanNgNhanTrongGhiChu = ttGiao.coNguoiGiao ? ttGiao.phanNguoiNhan : rawGc;
        let upperGc = phanNgNhanTrongGhiChu.toUpperCase();

        if (
            rawNg.toUpperCase() === "ALL" ||
            rawNg.toUpperCase() === "-TOÀN TRƯỜNG-" ||
            upperGc === "TOÀN TRƯỜNG" ||
            upperGc === "-TOÀN TRƯỜNG-" ||
            upperGc.includes("TOÀN TRƯỜNG")
        ) {
            return { isAll: true, ids: ["ALL"], names: ["ALL"] };
        }

        const dsHopLe = gvLayDsGiaoVienHopLe();
        const tapId = new Set();
        const mangTen = [];
        const mangId = [];

        const tachChuoi = (str) => {
            if (!str || /^\d+\s*người$/i.test(str.trim())) return;
            str.split(/[;,]+/).map(x => x.trim()).filter(x => x !== "").forEach(token => {
                if (/^\d+\s*người$/i.test(token)) return;
                let tenToken = token;
                let idToken = "";
                let mToken = token.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
                if (mToken) {
                    tenToken = mToken[1].trim();
                    idToken = mToken[2].trim();
                }
                let lowerTen = tenToken.toLowerCase();
                let lowerId = idToken.toLowerCase();

                let found = dsHopLe.find(s =>
                    (lowerId !== "" && s.ttrg && String(s.ttrg).trim().toLowerCase() === lowerId) ||
                    (s.ttrg && String(s.ttrg).trim().toLowerCase() === token.toLowerCase()) ||
                    (lowerTen !== "" && s.tenn && String(s.tenn).trim().toLowerCase() === lowerTen)
                );
                if (found && !tapId.has(found.ttrg)) {
                    tapId.add(found.ttrg);
                    mangId.push(found.ttrg);
                    mangTen.push(found.tenn);
                }
            });
        };

        tachChuoi(rawNg);
        tachChuoi(phanNgNhanTrongGhiChu);

        return { isAll: false, ids: mangId, names: mangTen };
    }

    // Hàm tiện ích: Quét toàn bộ bảng giao việc hiện tại để tìm tất cả các ID đã được giao và kiểm tra chủ sở hữu theo nội dung công việc
    function gvLayTapIdDaGiaoTheoNoiDung(noiDungCongViec) {
        const dsHopLe = gvLayDsGiaoVienHopLe();
        const tapIdDaGiao = new Set();
        let isAllDaGiao = false;
        let biKhoaBoiNguoiKhac = false;
        let chuSoHuuKhac = "";
        const ndChuan = String(noiDungCongViec || "").trim().toLowerCase();
        if (!ndChuan) return { isAll: false, tapId: tapIdDaGiao, biKhoa: false, chuSoHuu: "" };

        const cacDong = document.querySelectorAll('#gvThanBang tr');
        cacDong.forEach(tr => {
            const oNd = tr.querySelector('.oNdGv');
            if (!oNd) return;
            if (oNd.value.trim().toLowerCase() === ndChuan) {
                const oNgn = tr.querySelector('.oNnghanGv');
                const oGc = tr.querySelector('.oGchuGv');
                const gcVal = oGc ? oGc.value : "";
                const ktraQuyen = gvLaGiaoViecCuaNguoiKhac(gcVal);
                if (ktraQuyen.biKhoa) {
                    biKhoaBoiNguoiKhac = true;
                    chuSoHuuKhac = ktraQuyen.chuSoHuu;
                }

                const daGiaoAttr = oNgn ? String(oNgn.getAttribute('data-da-giao') || "").trim() : "";
                if (daGiaoAttr === "ALL") {
                    isAllDaGiao = true;
                    dsHopLe.forEach(s => tapIdDaGiao.add(s.ttrg));
                } else if (daGiaoAttr !== "") {
                    daGiaoAttr.split(",").map(x => x.trim()).filter(x => x !== "").forEach(id => tapIdDaGiao.add(id));
                }
                const pt = gvPhanTichNguoiNhan(oNgn ? oNgn.value : "", gcVal);
                if (pt.isAll) {
                    isAllDaGiao = true;
                    dsHopLe.forEach(s => tapIdDaGiao.add(s.ttrg));
                } else {
                    pt.ids.forEach(id => tapIdDaGiao.add(id));
                }
            }
        });

        return { isAll: isAllDaGiao, tapId: tapIdDaGiao, biKhoa: biKhoaBoiNguoiKhac, chuSoHuu: chuSoHuuKhac };
    }

                    inputNam.value = namValue; 
                } else { 
                    inputNam.value = "";

                inputNam.disabled = true;
            }
            
            const selectThang = document.getElementById('gvLocThang');

                }); 
            } else { 
                gvVeDong();

            gvTbaoNhanh('loi', "Lỗi xử lý dữ liệu: " + err.message);

        // [ĐÃ FIX TRIỆT ĐỂ] Bóc tách định tuyến tường minh cho 3 cấp độ: xxx, xx và phần còn lại

        } else {
            ptu.classList.remove('fw-bold', 'text-primary', 'text-uppercase');
            tdNoiDung.colSpan = 1;
            tr.querySelectorAll('td:nth-child(n+4)').forEach(td => { if (td) td.style.display = ''; });
            if (tdHdong) {
                const oGchu = tr.querySelector('.oGchuGv');
                const ktraSoHuu = gvLaGiaoViecCuaNguoiKhac(oGchu ? oGchu.value : '');
                if (ktraSoHuu.biKhoa) {
                    tdHdong.innerHTML = `<i class="bi bi-shield-lock-fill text-danger" title="Nhiệm vụ do ${ktraSoHuu.chuSoHuu} giao - Không có quyền xóa hoặc thay đổi"></i>`;
                } else {
                    tdHdong.innerHTML = '<button type="button" class="btn btn-danger btn-sm p-0" style="width:24px; height:24px;" onclick="gvXoaDong(this)" title="Xóa dòng nhiệm vụ này">X</button>';
                }
            }
        }
        gvAutoResizeAllTextareas();
    }

function gvVeDong(dong = null) {
    const tb = document.getElementById('gvThanBang');
    if (!tb) return;
    const tr = document.createElement('tr');
    
    let ndungGoc = (dong && dong[1]) ? String(dong[1]).trim() : "";
    let laTieuDe = ndungGoc.startsWith('*') || ndungGoc.includes('(*)');
    let ngnth = (dong && dong[6]) ? dong[6] : "";
    let gchuGoc = (dong && dong[8]) ? dong[8] : "";

    // Kiểm tra quyền sở hữu dòng giao việc: Người A không có quyền xóa/thay đổi giao việc của Người B
    const ktraSoHuu = gvLaGiaoViecCuaNguoiKhac(gchuGoc);
    const biKhoaKhac = ktraSoHuu.biKhoa;
    const dcb = biKhoaKhac ? "disabled" : "";
    const roKhac = biKhoaKhac ? "readonly" : "";

    let btnxoa = "";
    if (laTieuDe) {
        // Dòng tiêu đề mục: Khóa cố định, tuyệt đối không cho phép xóa
        btnxoa = `<i class="bi bi-lock-fill text-secondary" title="Dòng tiêu đề - Không được phép xóa"></i>`;
    } else if (biKhoaKhac) {
        btnxoa = `<i class="bi bi-shield-lock-fill text-danger" title="Nhiệm vụ do ${ktraSoHuu.chuSoHuu} giao - Không có quyền xóa hoặc thay đổi"></i>`;
    } else {
        btnxoa = `<button type="button" class="btn btn-danger btn-sm p-0" style="width:24px; height:24px;" onclick="gvXoaDong(this)" title="Xóa dòng nhiệm vụ này">X</button>`;
    }
    
    // NÂNG CẤP: Phân tích danh sách người thực hiện (hỗ trợ 1 người, nhiều người và ALL)
    let kqPhanTich = gvPhanTichNguoiNhan(ngnth, gchuGoc);
    let displayNgnth = "";
    let attrSelectedIds = "";

    if (kqPhanTich.isAll) {
        displayNgnth = "ALL";
        attrSelectedIds = "ALL";
    } else if (kqPhanTich.names.length > 0) {
        displayNgnth = kqPhanTich.names.join(", ");
        attrSelectedIds = kqPhanTich.ids.join(",");
    } else if (ngnth) {
        displayNgnth = ngnth;
    }

    let bstt = (dong && dong[0]) ? dong[0] : "";
    let cv_tdo = (dong && dong[4]) ? dong[4] : ""; // Dữ liệu ô Tiến độ
    
    let vTgGiao = (dong && dong[3]) ? dong[3] : "";
    let vTgHt = (dong && dong[5]) ? dong[5] : "";
    if (vTgGiao && vTgGiao.toLowerCase() === "dd/mm/yyyy") vTgGiao = "";
    if (vTgHt && vTgHt.toLowerCase() === "dd/mm/yyyy") vTgHt = "";
    
    let vDiemDg = (dong && dong[7]) ? dong[7] : "";
    let vColJ = (dong && dong[9]) ? dong[9] : "";
    let vColK = (dong && dong[10]) ? dong[10] : "";
    let vColL = (dong && dong[11]) ? dong[11] : "";
    let vColM = (dong && dong[12]) ? dong[12] : "";
    
    if (!dong) {
        const cacDong = document.querySelectorAll('#gvThanBang tr');
        if (cacDong && cacDong.length > 0) {
            const dongCuoi = cacDong[cacDong.length - 1];
            if (dongCuoi && dongCuoi.querySelector('.oDiemDgGv')) vDiemDg = dongCuoi.querySelector('.oDiemDgGv').value;
            if (dongCuoi && dongCuoi.querySelector('.oColJ')) vColJ = dongCuoi.querySelector('.oColJ').value;
            if (dongCuoi && dongCuoi.querySelector('.oColK')) vColK = dongCuoi.querySelector('.oColK').value;
            if (dongCuoi && dongCuoi.querySelector('.oColL')) vColL = dongCuoi.querySelector('.oColL').value;
            if (dongCuoi && dongCuoi.querySelector('.oColM')) vColM = dongCuoi.querySelector('.oColM').value;
        }
    }
    
    // NÂNG CẤP: Khóa ô Ghi chú (readonly) và bảo vệ dòng giao việc của người khác
    tr.innerHTML = `<td class="oHdong">${btnxoa}</td>
    <td class="text-center"><input type="text" class="form-control text-center fw-bold oSttGv" value="${bstt}" ${roKhac}></td>
    <td><textarea class="form-control oNdGv" placeholder="Nhập nội dung..." rows="1" oninput="gvCoDan(this); gvKiemTraTieuDe(this);" onfocus="gvCoDan(this)" ${roKhac}>${dong && dong[1] ? dong[1] : ""}</textarea></td>
    <td><input type="text" class="form-control text-center oDmaxGv fw-bold text-danger" placeholder="Điểm Max" value="${dong && dong[2] ? dong[2] : ""}" readonly></td>
    <td><input type="text" class="form-control text-center oTGGiao" placeholder="dd/mm/yyyy" onkeyup="gvDinhDangNgay(this, event)" value="${vTgGiao}" ${roKhac}></td>
    <td><input type="text" class="form-control text-center oTdoGv" list="dl_gvTienDo" onclick="this.select(); try{this.showPicker();}catch(e){}" placeholder="--Chọn--" value="${cv_tdo}" ${dcb}></td>
    <td><input type="text" class="form-control oNnghanGv text-center ${biKhoaKhac ? 'gv-locked-other' : ''}" readonly onclick="gvMoModalChonNguoi(this)" data-selected-ids="${attrSelectedIds}" data-da-giao="${attrSelectedIds}" title="${biKhoaKhac ? ('Do ' + ktraSoHuu.chuSoHuu + ' giao - Không có quyền thay đổi') : displayNgnth}" placeholder="-- Nhấn để chọn --" value="${displayNgnth}"></td>
    <td>
        <textarea class="form-control oGchuGv" placeholder="Tự động hiển thị người giao & số người nhận" rows="1" readonly oninput="gvCoDan(this)" onfocus="gvCoDan(this)">${gchuGoc}</textarea>
        <input type="hidden" class="oDiemDgGv" value="${vDiemDg}">
        <input type="hidden" class="oTGHoanThanh" value="${vTgHt}">
        <input type="hidden" class="oColJ" value="${vColJ}">
        <input type="hidden" class="oColK" value="${vColK}">
        <input type="hidden" class="oColL" value="${vColL}">
        <input type="hidden" class="oColM" value="${vColM}">
    </td>`;
    
    tb.appendChild(tr);
    const textareaNd = tr.querySelector('.oNdGv');
    if (textareaNd) gvKiemTraTieuDe(textareaNd);
}
    
    function gvCoDan(ptu) { 
        if (!ptu) return;
        ptu.style.height = 'auto'; 
        ptu.style.height = (ptu.scrollHeight) + 'px'; 
    }

    function gvDinhDangNgay(ptu, e) { 
        if (!ptu) return;
        if (e && (e.which === 8 || e.which === 46)) return; 
        let v = ptu.value.replace(/\D/g, ''); 
        if (v.length > 2) v = v.substring(0, 2) + '/' + v.substring(2); 
        if (v.length > 5) v = v.substring(0, 5) + '/' + v.substring(5, 9); 
        ptu.value = v; 
    }
  
   function gvThemDong() {
        const tbody = $('#gvThanBang');
        if (!tbody || tbody.length === 0) return;
        const lastRow = tbody.find('tr:last');

        if (lastRow.length === 0) {
            gvVeDong();
            $('#gvThanBang tr:last .oSttGv').val("1");
            setTimeout(() => gvAutoResizeAllTextareas(), 100);
            return;
        }

        var $newRow = lastRow.clone();

        let lastStt = lastRow.find('.oSttGv').val() || "";
        lastStt = lastStt.trim();
        let newStt = "1";

        let currentNum = parseInt(lastStt, 10);
        if (!isNaN(currentNum)) {
            newStt = (currentNum + 1).toString();
        }

        $newRow.find('.oSttGv').val(newStt).removeAttr('readonly').removeAttr('disabled');
        $newRow.find('.oNdGv').val('').removeAttr('readonly').removeAttr('disabled');
        $newRow.find('.oGchuGv').val('').prop('readonly', true);
        
        // [ĐÃ CẬP NHẬT] Nhân bản giá trị Điểm Max (Cột C) từ dòng trên
        $newRow.find('.oDmaxGv').val(lastRow.find('.oDmaxGv').val()); 
        
        $newRow.find('.oTGGiao').val('').removeAttr('readonly').removeAttr('disabled');
        $newRow.find('.oTdoGv').val('').removeAttr('readonly').removeAttr('disabled');
        $newRow.find('.oNnghanGv').val('').removeClass('gv-locked-other').attr('data-selected-ids', '').attr('data-da-giao', '').attr('title', '');
        $newRow.find('.oTGHoanThanh').val('');
        if ($newRow.find('.chonKq').length > 0) { $newRow.find('.chonKq').val(''); }

        $newRow.find('.oDiemDgGv').val(lastRow.find('.oDiemDgGv').val());
        $newRow.find('.oColJ').val(lastRow.find('.oColJ').val());
        $newRow.find('.oColK').val(lastRow.find('.oColK').val());
        $newRow.find('.oColL').val(lastRow.find('.oColL').val());
        $newRow.find('.oColM').val(lastRow.find('.oColM').val());
        
        $newRow.find('select').removeAttr('disabled'); 
        $newRow.find('.oHdong').html('<button type="button" class="btn btn-danger btn-sm p-0" style="width:24px; height:24px;" onclick="gvXoaDong(this)" title="Xóa dòng nhiệm vụ này">X</button>');
        
        $newRow.find('input:not([type="hidden"]), select').css({
            'background-color': 'transparent',
            'border-color': 'transparent',
            'font-weight': 'normal'
        });

        var $tdNoiDung = $newRow.find('td').eq(2); 
        if ($tdNoiDung.attr('colspan') && $tdNoiDung.attr('colspan') !== '1') {
            $tdNoiDung.attr('colspan', '1');
            $newRow.find('td').show();
        }

        $newRow.find('.oNdGv').removeClass('fw-bold text-primary text-uppercase');

        tbody.append($newRow);
        
        $newRow.find('textarea').each(function() { gvCoDan(this); });
        
        setTimeout(function() { 
            $newRow.find('.oNdGv').focus(); 
            let bangCuon = document.querySelector('#khuGvChinh .bangCuon');
            if (bangCuon) {
                bangCuon.scrollTop = bangCuon.scrollHeight;
            }
            gvAutoResizeAllTextareas();
        }, 100);
        
        if (typeof tinhtTdong === 'function') tinhtTdong();
        if (typeof mokBcao === 'function') mokBcao();
    }
    
    // NÂNG CẤP: Hàm đánh lại số thứ tự (STT) trong Lưới bảng giao việc
    function gvCapNhatLaiSttBang() {
        const rNumerals = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII","XIII","XIV","XV"];
        const cacDong = document.querySelectorAll('#gvThanBang tr');
        let rCount = 0;
        let iCount = 0;
        cacDong.forEach(tr => {
            const oNd = tr.querySelector('.oNdGv');
            const oStt = tr.querySelector('.oSttGv');
            if (!oStt) return;
            const nd = oNd ? oNd.value.trim() : "";
            if (!nd) return;
            if (nd.startsWith('*') || nd.includes('(*)')) {
                rCount++;
                iCount = 0;
                oStt.value = rNumerals[rCount - 1] || rCount;
            } else {
                iCount++;
                oStt.value = iCount;
            }
        });
    }

    function gvXoaDong(btn) { 
        if (!btn) return;
        const row = btn.closest('tr');
        if (!row) return;

        const oNd = row.querySelector('.oNdGv');
        const ndg = oNd ? oNd.value.trim() : "";
        // Bảo vệ dòng tiêu đề: Tuyệt đối không cho phép xóa
        if (ndg.startsWith('*') || ndg.includes('(*)')) {
            gvTbaoNhanh('cbh', "⚠️ DÒNG TIÊU ĐỀ KHÔNG ĐƯỢC PHÉP XÓA!\nĐây là tiêu đề phân mục nhiệm vụ chung của hệ thống.");
            return;
        }

        const oGchu = row.querySelector('.oGchuGv');
        const ktraSoHuu = gvLaGiaoViecCuaNguoiKhac(oGchu ? oGchu.value : "");
        if (ktraSoHuu.biKhoa) {
            gvTbaoNhanh('loi', `⛔ KHÔNG CÓ QUYỀN XÓA!\nNhiệm vụ này do <b>${ktraSoHuu.chuSoHuu}</b> giao.\nĐồng chí không có quyền xóa hoặc thay đổi giao việc của người khác!`);
            return;
        }
        const oNgn = row.querySelector('.oNnghanGv');
        const daGiaoAttr = oNgn ? String(oNgn.getAttribute('data-da-giao') || "").trim() : "";
        const selectedIdsAttr = oNgn ? String(oNgn.getAttribute('data-selected-ids') || "").trim() : "";
        const valNgn = oNgn ? String(oNgn.value || "").trim() : "";

        // Trường hợp 1: Dòng mới thêm vào bảng (chưa có nội dung và chưa từng giao lên hệ thống)
        if (!ndg && !daGiaoAttr && !selectedIdsAttr && !valNgn) {
            row.remove();
            gvCapNhatLaiSttBang();
            if (document.querySelectorAll('#gvThanBang tr').length === 0) {
                gvVeDong();
            }
            setTimeout(() => gvAutoResizeAllTextareas(), 50);
            return;
        }

        // Trường hợp 2: Dòng đã có nội dung hoặc đã được giao trên hệ thống
        const tenNdHienThi = ndg || "nhiệm vụ này";
        const thongBaoXacNhan = `⚠️ XÁC NHẬN XÓA DÒNG NHIỆM VỤ?\n\n` +
            `Đồng chí có chắc chắn muốn xóa vĩnh viễn nhiệm vụ:\n"${tenNdHienThi}"?\n\n` +
            `Hệ thống sẽ thực hiện:\n` +
            `1. Xóa hoàn toàn dòng nhiệm vụ này khỏi bảng GIAO VIỆC của nhà trường.\n` +
            `2. Tự động thu hồi và xóa nhiệm vụ này khỏi phiếu cá nhân của tất cả giáo viên đã được giao (nếu đã giao nhầm).\n\n` +
            `Đồng chí có muốn tiếp tục xóa không?`;

        if (!confirm(thongBaoXacNhan)) return;

        const nm = document.getElementById('gvLocNam') ? document.getElementById('gvLocNam').value : "";
        const th_htai = document.getElementById('gvLocThang') ? document.getElementById('gvLocThang').value : "";
        const ngDangNhap = gvLayThongTinNguoiDangNhap();
        const pt = gvPhanTichNguoiNhan(valNgn, oGchu ? oGchu.value : "");

        let dsIdTruocDo = [];
        if (daGiaoAttr === "ALL" || pt.isAll) {
            dsIdTruocDo = ["ALL"];
        } else if (daGiaoAttr !== "") {
            dsIdTruocDo = daGiaoAttr.split(",").map(x => x.trim()).filter(x => x !== "");
        } else if (pt.ids && pt.ids.length > 0) {
            dsIdTruocDo = pt.ids;
        }

        const taskXoa = {
            hanhdong: "XOA",
            xoa: true,
            ngnhan: "XOA_DONG",
            ndung: ndg,
            stt: row.querySelector('.oSttGv') ? row.querySelector('.oSttGv').value : "",
            dsIdTruocDo: dsIdTruocDo,
            nguoiGiaoId: ngDangNhap.id,
            nguoiGiaoTen: ngDangNhap.ten,
            nguoiGiaoTaik: ngDangNhap.taik
        };

        gvDatTai(true, "⏳ Đang xóa nhiệm vụ & thu hồi dữ liệu...");

        if (typeof khachApi === 'undefined' || !khachApi.gvXulyNviec) {
            gvDatTai(false);
            gvTbaoNhanh('loi', "Lỗi: Cổng kết nối API máy chủ chưa sẵn sàng.");
            return;
        }

        khachApi.gvXulyNviec({ nam: nm, thang: th_htai, nviec: taskXoa }, function(kq) {
            gvDatTai(false);
            if (kq && kq.ttai === 'tcong') {
                row.remove();
                gvCapNhatLaiSttBang();
                if (document.querySelectorAll('#gvThanBang tr').length === 0) {
                    gvVeDong();
                }
                setTimeout(() => gvAutoResizeAllTextareas(), 50);

                let noiDungThongBao = kq.tbao || `✓ Đã xóa nhiệm vụ "${ndg}" thành công!`;
                if (typeof kq.soThuHoi === 'number' && kq.soThuHoi > 0) {
                    let chiTietThuHoi = (kq.dsThuHoi && kq.dsThuHoi.length > 0) ? `<br><small class="text-muted">(${kq.dsThuHoi.join(", ")})</small>` : "";
                    noiDungThongBao = `✅ Đã xóa nhiệm vụ khỏi bảng Giao việc thành công!<br>🔄 Đã tự động thu hồi/xóa khỏi phiếu cá nhân của: <b>${kq.soThuHoi} giáo viên</b>.${chiTietThuHoi}`;
                }
                gvTbaoNhanh('tc', noiDungThongBao);
            } else {
                gvTbaoNhanh('loi', "Lỗi khi xóa nhiệm vụ: " + (kq ? kq.tbao : "Không xác định"));
            }
        }, function(loi) {
            gvDatTai(false);
            gvTbaoNhanh('loi', "Lỗi kết nối máy chủ: " + (loi ? loi.message : "Không xác định"));
        });
    }

    // NÂNG CẤP: UI Modal Chọn Người Thực Hiện (Họ tên + ID đầy đủ + Checkbox + Chọn tất cả + Thu hồi + Chặn sửa chéo giữa các người giao)
    function gvMoModalChonNguoi(ptu) {
        if (!ptu || ptu.disabled) return;
        const dong = ptu.closest('tr');
        if (!dong) return;

        // 1. Kiểm tra quyền sở hữu ngay trên dòng hiện tại
        const gchuInput = dong.querySelector('.oGchuGv');
        const ktraTrenDong = gvLaGiaoViecCuaNguoiKhac(gchuInput ? gchuInput.value : "");
        if (ktraTrenDong.biKhoa) {
            gvTbaoNhanh('loi', `⛔ KHÔNG CÓ QUYỀN THAY ĐỔI!\nNhiệm vụ này do <b>${ktraTrenDong.chuSoHuu}</b> giao.\nĐồng chí không có quyền xóa hoặc thay đổi giao việc của người khác!`);
            return;
        }

        const ndgInput = dong.querySelector('.oNdGv');
        if (!ndgInput) return;
        const ndg = ndgInput.value.trim();
        if (!ndg) {
            gvTbaoNhanh('cbh', "Nội dung công việc không được để trống! Vui lòng nhập nội dung công việc trước khi chọn người thực hiện.", function() {
                ndgInput.focus();
            });
            return;
        }

        const dsHopLe = gvLayDsGiaoVienHopLe();
        if (dsHopLe.length === 0) {
            gvTbaoNhanh('cbh', "Danh sách nhân sự trống hoặc chưa tải xong. Vui lòng thử lại!");
            return;
        }

        // 2. Quét toàn bộ các dòng có cùng nội dung công việc để kiểm tra chủ sở hữu và các ID đã được giao trước đó
        const thongTinDaGiao = gvLayTapIdDaGiaoTheoNoiDung(ndg);
        if (thongTinDaGiao.biKhoa) {
            gvTbaoNhanh('loi', `⛔ KHÔNG CÓ QUYỀN THAY ĐỔI!\nNhiệm vụ "${ndg}" đã do <b>${thongTinDaGiao.chuSoHuu}</b> giao.\nĐồng chí không có quyền xóa hoặc thay đổi giao việc của người khác!`);
            return;
        }

        const tapDaGiao = thongTinDaGiao.tapId;
        const isAllDaGiao = thongTinDaGiao.isAll;

        const kqHienTai = gvPhanTichNguoiNhan(ptu.value, gchuInput ? gchuInput.value : "");

        const tapDangChon = new Set();
        if (kqHienTai.isAll || isAllDaGiao) {
            dsHopLe.forEach(s => tapDangChon.add(s.ttrg));
        } else {
            kqHienTai.ids.forEach(id => tapDangChon.add(id));
            tapDaGiao.forEach(id => tapDangChon.add(id));
        }

        const oldModal = document.getElementById('gvModalChonNguoiOverlay');
        if (oldModal) oldModal.remove();

        const overlay = document.createElement('div');
        overlay.id = 'gvModalChonNguoiOverlay';
        overlay.className = 'gv-modal-overlay';

        let listHtml = '';
        dsHopLe.forEach((s, idx) => {
            const isChecked = tapDangChon.has(s.ttrg);
            const isDaGiao = tapDaGiao.has(s.ttrg) || isAllDaGiao;
            const safeName = String(s.tenn || "").replace(/"/g, '&quot;');
            const safeId = String(s.ttrg || "").replace(/"/g, '&quot;');
            listHtml += `
                <label class="gv-chon-item ${isChecked ? 'checked' : ''}" data-id="${safeId}" data-da-giao="${isDaGiao ? '1' : '0'}" data-search="${safeName.toLowerCase()} ${safeId.toLowerCase()}">
                    <div class="gv-chon-item-left">
                        <input type="checkbox" class="gv-chk-gv" value="${safeId}" data-name="${safeName}" ${isChecked ? 'checked' : ''}>
                        <span class="gv-chon-item-name" title="${safeName}">${idx + 1}. ${s.tenn || ''}</span>
                    </div>
                    <div class="gv-chon-item-right">
                        <span class="gv-status-slot">${isDaGiao ? '<span class="gv-chon-dagiao-badge" title="ID này đã được giao trước đó">Đã giao</span>' : ''}</span>
                        <span class="gv-chon-id-badge">ID: ${s.ttrg || ''}</span>
                    </div>
                </label>
            `;
        });

        const isAllInit = (tapDangChon.size === dsHopLe.length && dsHopLe.length > 0);
        const ngDangNhap = gvLayThongTinNguoiDangNhap();

        overlay.innerHTML = `
            <div class="gv-chon-modal">
                <div class="gv-chon-header">
                    <div>
                        <div class="gv-chon-title">Chọn / Thu hồi người thực hiện</div>
                        <div class="gv-chon-subtitle" title="${ndg.replace(/"/g, '&quot;')}">📌 ${ndg}${ngDangNhap.hienThi ? (' — Người giao: ' + ngDangNhap.hienThi) : ''}</div>
                    </div>
                    <button type="button" class="gv-chon-close" id="gvBtnDongModalChon" title="Đóng">&times;</button>
                </div>
                <div class="gv-chon-toolbar">
                    <input type="text" class="gv-chon-search" id="gvInputTimGv" placeholder="🔍 Tìm nhanh theo Họ tên hoặc Mã ID giáo viên..." autocomplete="off">
                    <label class="gv-chon-all-bar" id="gvBarChonTatCa">
                        <div class="gv-chon-all-left">
                            <input type="checkbox" id="gvChkChonTatCa" ${isAllInit ? 'checked' : ''}>
                            <span>Chọn tất cả (-TOÀN TRƯỜNG-)</span>
                        </div>
                        <span class="gv-chon-count-badge" id="gvBadgeSoLuongChon">Đã chọn: ${tapDangChon.size}/${dsHopLe.length}</span>
                    </label>
                </div>
                <div class="gv-chon-list" id="gvDanhSachCheckGv">
                    ${listHtml}
                </div>
                <div class="gv-chon-footer">
                    <button type="button" class="gv-chon-btn-cancel" id="gvBtnHuyChonGv">Hủy bỏ</button>
                    <button type="button" class="gv-chon-btn-submit" id="gvBtnXacNhanGiaoViec">
                        <span>✓ Xác nhận & Giao việc</span>
                    </button>
                </div>
            </div>
        `;

        document.body.appendChild(overlay);

        const chkAll = overlay.querySelector('#gvChkChonTatCa');
        const badgeCount = overlay.querySelector('#gvBadgeSoLuongChon');
        const searchInput = overlay.querySelector('#gvInputTimGv');
        const allItemLabels = Array.from(overlay.querySelectorAll('.gv-chon-item'));
        const allCheckboxes = Array.from(overlay.querySelectorAll('.gv-chk-gv'));
        const btnSubmit = overlay.querySelector('#gvBtnXacNhanGiaoViec');

        const capNhatGiaoDienTungDong = (lbl, checked) => {
            if (!lbl) return;
            const laDaGiaoCu = lbl.getAttribute('data-da-giao') === '1';
            const slot = lbl.querySelector('.gv-status-slot');
            if (checked) {
                lbl.classList.add('checked');
                lbl.classList.remove('revoked');
                if (slot) {
                    slot.innerHTML = laDaGiaoCu
                        ? '<span class="gv-chon-dagiao-badge" title="ID này đã được giao trước đó">Đã giao</span>'
                        : '';
                }
            } else {
                lbl.classList.remove('checked');
                if (laDaGiaoCu) {
                    lbl.classList.add('revoked');
                    if (slot) {
                        slot.innerHTML = '<span class="gv-chon-thuhoi-badge" title="Bỏ tích: Hệ thống sẽ thu hồi và xóa nhiệm vụ khỏi sheet riêng của giáo viên này">Sẽ thu hồi</span>';
                    }
                } else {
                    lbl.classList.remove('revoked');
                    if (slot) slot.innerHTML = '';
                }
            }
        };

        const capNhatTrangThai = () => {
            let count = tapDangChon.size;
            const total = dsHopLe.length;
            const isAll = (count === total && total > 0);
            let soThuHoi = 0;
            tapDaGiao.forEach(idCu => {
                if (!tapDangChon.has(idCu)) soThuHoi++;
            });

            chkAll.checked = isAll;
            chkAll.indeterminate = (count > 0 && count < total);
            badgeCount.textContent = isAll
                ? `TOÀN TRƯỜNG (${count}/${total})`
                : (soThuHoi > 0 ? `Chọn: ${count} | Thu hồi: ${soThuHoi}` : `Đã chọn: ${count}/${total}`);

            if (isAll) {
                btnSubmit.innerHTML = `<span>🚀 Giao TOÀN TRƯỜNG (${total})</span>`;
                btnSubmit.style.background = '#198754';
            } else if (count === 0 && soThuHoi > 0) {
                btnSubmit.innerHTML = `<span>🔄 Thu hồi toàn bộ (${soThuHoi})</span>`;
                btnSubmit.style.background = '#dc3545';
            } else if (soThuHoi > 0) {
                btnSubmit.innerHTML = `<span>✓ Xác nhận (${count} giao, ${soThuHoi} thu hồi)</span>`;
                btnSubmit.style.background = '#0d6efd';
            } else {
                btnSubmit.innerHTML = `<span>✓ Xác nhận & Giao việc (${count})</span>`;
                btnSubmit.style.background = '#198754';
            }
        };

        capNhatTrangThai();

        allCheckboxes.forEach(chk => {
            chk.addEventListener('change', function() {
                const id = this.value;
                const parentLabel = this.closest('.gv-chon-item');
                if (this.checked) {
                    tapDangChon.add(id);
                } else {
                    tapDangChon.delete(id);
                }
                capNhatGiaoDienTungDong(parentLabel, this.checked);
                capNhatTrangThai();
            });
        });

        chkAll.addEventListener('change', function() {
            const checked = this.checked;
            allCheckboxes.forEach(chk => {
                chk.checked = checked;
                const parentLabel = chk.closest('.gv-chon-item');
                if (checked) {
                    tapDangChon.add(chk.value);
                } else {
                    tapDangChon.delete(chk.value);
                }
                capNhatGiaoDienTungDong(parentLabel, checked);
            });
            capNhatTrangThai();
        });

        searchInput.addEventListener('input', function() {
            const kw = this.value.trim().toLowerCase();
            allItemLabels.forEach(lbl => {
                const dataSearch = lbl.getAttribute('data-search') || '';
                lbl.style.display = (!kw || dataSearch.includes(kw)) ? 'flex' : 'none';
            });
        });

        setTimeout(() => searchInput.focus(), 60);

        const dongModal = () => overlay.remove();
        overlay.querySelector('#gvBtnDongModalChon').addEventListener('click', dongModal);
        overlay.querySelector('#gvBtnHuyChonGv').addEventListener('click', dongModal);
        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) dongModal();
        });

        btnSubmit.addEventListener('click', function() {
            const dsIdThuHoi = [];
            tapDaGiao.forEach(idCu => {
                if (!tapDangChon.has(idCu)) dsIdThuHoi.push(idCu);
            });

            if (tapDangChon.size === 0 && dsIdThuHoi.length === 0) {
                gvTbaoNhanh('cbh', "Vui lòng tích chọn ít nhất 1 giáo viên hoặc tích 'Chọn tất cả (-TOÀN TRƯỜNG-)'!");
                return;
            }
            const laToanTruong = (tapDangChon.size === dsHopLe.length && dsHopLe.length > 0);
            const dsNguoiChon = dsHopLe.filter(s => tapDangChon.has(s.ttrg)).map(s => ({
                ttrg: s.ttrg,
                tenn: s.tenn
            }));
            const dsIdTruocDo = Array.from(tapDaGiao);
            dongModal();
            gvThucHienGiaoTuModal(ptu, laToanTruong, dsNguoiChon, dsIdThuHoi, dsIdTruocDo);
        });
    }

    // Hàm thực thi giao việc & thu hồi sau khi người dùng xác nhận trong Modal
    function gvThucHienGiaoTuModal(ptu, laToanTruong, dsNguoiChon, dsIdThuHoi = [], dsIdTruocDo = []) {
        if (!ptu) return;
        const dong = ptu.closest('tr');
        if (!dong) return;
        const ndgInput = dong.querySelector('.oNdGv');
        const ndg = ndgInput ? ndgInput.value.trim() : "";
        if (!ndg) {
            gvTbaoNhanh('cbh', "Nội dung công việc không được để trống!");
            return;
        }

        const nm = document.getElementById('gvLocNam') ? document.getElementById('gvLocNam').value : "";
        const th_htai = document.getElementById('gvLocThang') ? document.getElementById('gvLocThang').value : "";
        const ngDangNhap = gvLayThongTinNguoiDangNhap();
        const oGchu = dong.querySelector('.oGchuGv');
        const gchuCu = oGchu ? oGchu.value : "";

        let ma_tai_khoan = "";
        let ten_hien_thi = "";
        let gth = "";

        if (laToanTruong) {
            ma_tai_khoan = "ALL";
            ten_hien_thi = "-TOÀN TRƯỜNG-";
            gth = "ALL";
            ptu.value = "ALL";
            ptu.setAttribute('data-selected-ids', 'ALL');
            ptu.title = "-TOÀN TRƯỜNG-";
        } else {
            const mangId = dsNguoiChon.map(x => x.ttrg);
            const mangTen = dsNguoiChon.map(x => x.tenn);
            ma_tai_khoan = mangId.join(", ");
            ten_hien_thi = mangTen.join(", ");
            gth = ma_tai_khoan.toUpperCase();
            ptu.value = ten_hien_thi;
            ptu.setAttribute('data-selected-ids', mangId.join(","));
            ptu.title = ten_hien_thi;
        }

        // Tạo chuỗi Ghi chú chuẩn gọn nhẹ: "Người giao: Họ tên (ID): (X người)"
        const ghiChuMoi = gvTaoChuoiGhiChuChuan(dsNguoiChon, laToanTruong, gchuCu);
        if (oGchu) {
            oGchu.value = ghiChuMoi;
            gvCoDan(oGchu);
        }

        const newTask = {
            stt: "",
            ndung: ndg,
            diemmax: dong.querySelector('.oDmaxGv') ? dong.querySelector('.oDmaxGv').value : "",
            tggiao: dong.querySelector('.oTGGiao') ? dong.querySelector('.oTGGiao').value : "",
            tdo: dong.querySelector('.oTdoGv') ? dong.querySelector('.oTdoGv').value : "",
            tght: dong.querySelector('.oTGHoanThanh') ? dong.querySelector('.oTGHoanThanh').value : "",
            diemdg: dong.querySelector('.oDiemDgGv') ? dong.querySelector('.oDiemDgGv').value : "",
            gchu: ghiChuMoi,
            ngnhan: ma_tai_khoan,
            trangngnhan: ma_tai_khoan,
            tenngnhan: ten_hien_thi,
            dsNguoiNhan: laToanTruong ? [] : dsNguoiChon,
            dsIdThuHoi: dsIdThuHoi,
            dsIdTruocDo: dsIdTruocDo,
            nguoiGiaoId: ngDangNhap.id,
            nguoiGiaoTen: ngDangNhap.ten,
            nguoiGiaoTaik: ngDangNhap.taik,
            colJ: dong.querySelector('.oColJ') ? dong.querySelector('.oColJ').value : "",
            colK: dong.querySelector('.oColK') ? dong.querySelector('.oColK').value : "",
            colL: dong.querySelector('.oColL') ? dong.querySelector('.oColL').value : "",
            colM: dong.querySelector('.oColM') ? dong.querySelector('.oColM').value : ""
        };

        let tbht = "⏳ Đang đồng bộ giao việc...";
        if (laToanTruong) {
            tbht = "🚀 Đang giao cho TOÀN TRƯỜNG 🚀";
        } else if (dsIdThuHoi.length > 0 && dsNguoiChon.length === 0) {
            tbht = `🔄 Đang thu hồi nhiệm vụ của ${dsIdThuHoi.length} giáo viên...`;
        } else if (dsIdThuHoi.length > 0) {
            tbht = `⏳ Đang cập nhật giao việc (${dsNguoiChon.length}) & thu hồi (${dsIdThuHoi.length})...`;
        } else {
            tbht = `⏳ Đang kiểm tra & giao việc cho ${dsNguoiChon.length} giáo viên...`;
        }
        gvDatTai(true, tbht);
        gvGoiMayChu(nm, th_htai, newTask, ptu, gth);
    }

// HÀM 1: LƯU TỪNG DÒNG (Giữ nguyên tên hàm gvDoiNgn để tương thích ngược 100%)
    function gvDoiNgn(ptu) {
        if (!ptu) return;
        gvMoModalChonNguoi(ptu);
    }

    function gvGoiMayChu(n, t, nv, ptu, hth) { 
        if (typeof khachApi === 'undefined' || !khachApi.gvXulyNviec) {
            gvTbaoNhanh('loi', "Lỗi: API không khả dụng.");
            gvDatTai(false);
            return;
        }
        khachApi.gvXulyNviec( { nam: n, thang: t, nviec: nv }, function(kq) { 
            gvDatTai(false); 
            if (kq && kq.ttai === 'tcong') { 
                let noiDungThongBao = kq.tbao || "✓ Giao việc thành công!";
                if (typeof kq.soMoiGiao === 'number') {
                    let cacDong = [`✅ Đã giao việc cho: <b>${kq.soMoiGiao} người</b>.`];
                    if (typeof kq.soDaGiaoTruoc === 'number' && kq.soDaGiaoTruoc > 0) {
                        cacDong.push(`ℹ️ Đã giao trước đó (bỏ qua): <b>${kq.soDaGiaoTruoc} người</b>.`);
                    }
                    if (typeof kq.soThuHoi === 'number' && kq.soThuHoi > 0) {
                        let chiTietThuHoi = (kq.dsThuHoi && kq.dsThuHoi.length > 0) ? ` (${kq.dsThuHoi.join(", ")})` : "";
                        cacDong.push(`🔄 Đã thu hồi (xóa khỏi sheet riêng): <b>${kq.soThuHoi} người</b>${chiTietThuHoi}.`);
                    }
                    noiDungThongBao = cacDong.join("<br>");
                }
                gvTbaoNhanh('tc', noiDungThongBao);
                if (ptu) {
                    if (kq.dsIdDaNhan && Array.isArray(kq.dsIdDaNhan)) {
                        const chuoiId = kq.dsIdDaNhan.join(",");
                        ptu.setAttribute('data-selected-ids', chuoiId);
                        ptu.setAttribute('data-da-giao', chuoiId);
                        if (kq.dsIdDaNhan.length === 0) {
                            ptu.value = "";
                            ptu.title = "";
                            ptu.style.backgroundColor = 'transparent';
                            ptu.style.borderColor = 'transparent';
                            ptu.style.fontWeight = 'normal';
                        } else {
                            ptu.style.backgroundColor = '#d1e7dd'; 
                            ptu.style.borderColor = '#badbcc'; 
                            ptu.style.fontWeight = 'bold'; 
                        }
                    } else {
                        const curSelected = ptu.getAttribute('data-selected-ids') || '';
                        ptu.setAttribute('data-da-giao', curSelected);
                        ptu.style.backgroundColor = '#d1e7dd'; 
                        ptu.style.borderColor = '#badbcc'; 
                        ptu.style.fontWeight = 'bold'; 
                    }
                    if (kq.nguoiNhan !== undefined && hth !== 'ALL') {
                        ptu.value = kq.nguoiNhan;
                        ptu.title = kq.nguoiNhan;
                    }
                    const dong = ptu.closest('tr');
                    if (dong) {
                        const oGchu = dong.querySelector('.oGchuGv');
                        if (oGchu) {
                            if (kq.ghiChu !== undefined) {
                                oGchu.value = kq.ghiChu;
                            } else if (nv && nv.gchu) {
                                oGchu.value = nv.gchu;
                            }
                            gvCoDan(oGchu);
                        }
                    }
                }
            } else { 
                gvTbaoNhanh('loi', "Lỗi Server: " + (kq ? kq.tbao : "Unknown")); 
                if (ptu && ptu.tagName !== 'BUTTON') {
                    const prevDaGiao = ptu.getAttribute('data-da-giao') || '';
                    if (!prevDaGiao) ptu.value = "";
                }
            } 
        }, function(l) { 
            gvDatTai(false); 
            gvTbaoNhanh('loi', "Lỗi kết nối: " + (l ? l.message : "Không xác định")); 
        }); 
    }

function gvXlmChth(btn) {
        if (!confirm("Đồng chí có chắc chắn muốn chuyển sang tháng tiếp theo và làm mới toàn bộ dữ liệu giao việc?")) return;
        
        let selectThang = document.getElementById('gvLocThang');
        if (!selectThang) return;
        let val = selectThang.value;
        let match = val.match(/\d+/);
        let thangHienTai = match ? parseInt(match[0]) : 1;
        let thangMoi = thangHienTai + 1;
        if (thangMoi > 12) thangMoi = 1;
        
        // 1. Cập nhật giá trị tháng trên giao diện
        selectThang.value = "Tháng " + thangMoi;
        
        const nm = document.getElementById('gvLocNam') ? document.getElementById('gvLocNam').value : "";
        const th_htai = selectThang.value; // Dùng tháng mới
        
        // 2. KHÓA MÀN HÌNH BẢO VỆ: Đảm bảo người dùng không thao tác khi máy chủ đang dọn dẹp và nạp mẫu mới
        gvDatTai(true, "⏳ Đang khởi tạo biểu mẫu cho " + th_htai + "...");
        
        // Lệnh đặc biệt gửi xuống Server để thiết lập/xóa dữ liệu tháng mới
        const newTask = { ngnhan: "DELETE" };
        
        // 3. GỌI API VÀ LÀM MỚI TOÀN BỘ
        if (typeof khachApi !== 'undefined' && khachApi.gvXulyNviec) {
            khachApi.gvXulyNviec({ nam: nm, thang: th_htai, nviec: newTask }, function(kq) {
                if (kq && kq.ttai === 'tcong') {
                    // [NÂNG CẤP QUAN TRỌNG]: Gọi lại hàm gvLaydlGoc() để tải form mẫu nhiệm vụ chung từ máy chủ
                    // Tuyệt đối không tự vẽ dòng trống để tránh mất định dạng khung
                    gvTbaoNhanh('tc', "Chuyển tháng thành công! Đang đồng bộ lại biểu mẫu...", function() {
                        gvLaydlGoc(); 
                    });
                } else {
                    gvDatTai(false); // Mở khóa màn hình nếu lỗi
                    gvTbaoNhanh('loi', "Cảnh báo: Lỗi khi dọn dẹp máy chủ: " + (kq ? kq.tbao : "Không xác định"));
                }
            }, function(loi) {
                gvDatTai(false);
                console.warn("Lỗi tiến trình ngầm khi chuyển tháng: ", loi);
                gvTbaoNhanh('loi', "Lỗi kết nối khi đồng bộ máy chủ.");
            });
        } else {
            gvDatTai(false);
            gvTbaoNhanh('loi', "Lỗi: Cổng kết nối API không khả dụng.");
        }
    }
</script>
