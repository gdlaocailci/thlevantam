<style>
  /* --- BỘ CỤC FLEXBOX NÂNG CẤP (KHẮC PHỤC TRIỆT ĐỂ LỖI THANH CUỘN VÀ Z-INDEX) --- */
  .bo-cuc-tab-nhiemvu { display: flex; flex-direction: column; height: calc(100vh - 40px); width: 100%; }
  
  /* Nâng phân lớp vùng điều khiển lên cao nhất để Hộp chọn thả xuống không bao giờ bị bảng đè lên */

  /* Khối bảng tự động lấp đầy khoảng trống còn lại, sinh thanh cuộn chuẩn xác */

  .table-responsive { flex: 1 1 auto; overflow-y: auto !important; overflow-x: hidden; min-height: 0; }

  /* --- KẾ THỪA CÁC ĐỊNH DẠNG CSS CŨ --- */
  .hopDau { background-color: #e9ecef; padding: 5px 10px; border-radius: 5px; margin-bottom: 5px; border: 1px solid #ced4da; }
  .loGo { font-weight: bold; color: #0d6efd; text-transform: uppercase; font-size: 14px; }
  .tDe { font-weight: bold; color: #dc3545; font-size: 20px; text-transform: uppercase; margin: 0; }
  .nhanNhiemVu { font-weight: bold; color: #333; font-size: 14px; }
  .chuThongTin { font-weight: bold; color: #0d6efd; font-size: 15px; margin-left: 5px; }
  .nhapTuyChinh { border: 1px solid #ced4da; border-radius: 4px; padding: 2px; outline: none; height: 30px; font-size: 14px; }
  .epMotDong { white-space: nowrap !important; overflow: hidden !important; text-overflow: ellipsis !important; }
  #bangNviec { table-layout: fixed; width: 100%; word-wrap: break-word; border-collapse: collapse; border: none; }
  #bangNviec thead th { position: sticky; top: 0; z-index: 10; background-color: #0d6efd !important; color: white !important; vertical-align: middle; text-align: center; padding: 8px 5px; font-size: 13px; border: none; border-right: 1px solid #7ea8f8;}
  #bangNviec th:last-child { border-right: none; }
  #bangNviec td { 
      vertical-align: middle !important; 
      padding: 0 !important; 
      border: none !important; 
      border-bottom: 1px dashed #dee2e6 !important; 
      border-right: 1px solid #dee2e6 !important; 
      overflow: visible !important; 
  }
  #bangNviec td:last-child { border-right: none !important; }
  #bangNviec textarea.form-control, #bangNviec input.form-control, #bangNviec select.form-select { 
      border: none !important; 
      background-color: transparent !important; 
      box-shadow: none !important; 
      border-radius: 0 !important;
      padding: 4px 6px !important; 
      margin: 0 !important;
      font-size: 14px;
      line-height: 1.15 !important; 
      resize: none; 
      overflow: hidden;
      white-space: normal !important; 
      word-wrap: break-word !important; 
      position: relative;
      z-index: 1; /* Hạ z-index của các ô nhập liệu trong bảng để không cản trở hộp chọn */
  }
  #bangNviec textarea.form-control { min-height: 35px; white-space: pre-wrap; cursor: default; }
  #bangNviec .nhapNgay, #bangNviec .chonKq { text-align: center; font-weight: bold; height: auto; min-height: 30px; }
  #bangNviec input::placeholder { color: #adb5bd; font-style: italic; }

  .diemCong, .diemCong:disabled { background-color: #0d6efd !important; color: white !important; font-weight: bold; opacity: 1 !important; -webkit-text-fill-color: white !important; }
  .diemTru, .diemTru:disabled { background-color: #dc3545 !important; color: white !important; font-weight: bold; opacity: 1 !important; -webkit-text-fill-color: white !important; }
  .diemKhong, .diemKhong:disabled { background-color: #28a745 !important; color: black !important; font-weight: bold; opacity: 1 !important; -webkit-text-fill-color: black !important; }
  button:disabled { cursor: not-allowed !important; opacity: 0.5 !important; filter: grayscale(100%) !important; pointer-events: none !important; box-shadow: none !important; }
  
  #bangNviec select.form-select.chonKq,
  #bangNviec input.chonKq {
      border: 1px solid #adb5bd !important;
      background-color: #ffffff !important;
      border-radius: 6px !important;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05) !important;
      padding: 5px 8px !important;
      width: 300px !important;
      max-width: 300px !important; 
      box-sizing: border-box !important;
      font-weight: 500 !important;
      transition: 0.1s ease;
      cursor: pointer;
      white-space: normal !important; 
      word-wrap: break-word !important;
      overflow-wrap: break-word !important;
      height: auto !important;
      max-height: 500px;
  }
  #bangNviec select.form-select.chonKq option {
      white-space: normal !important;
      word-break: break-word !important;
      word-wrap: break-word !important;
      padding: 6px 8px !important;
      max-width: 350px !important;
  }
  #bangNviec textarea.form-control,
  #bangNviec input:not(.chonKq) {
      border: none !important;
      background-color: transparent !important;
  }
  .btn-reactbits-shiny {
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
  }
  .btn-reactbits-shiny::after {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
    transform: skewX(-20deg);
    animation: reactbits-sweep 4s infinite;
  }
  @keyframes reactbits-sweep {
    0% { left: -100%; }
    20% { left: 200%; }
    100% { left: 200%; }
  }
  .btn-reactbits-shiny:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 4px 10px rgba(0,0,0,0.15) !important;
  }
</style>

<script>
// Toàn bộ logic hệ thống gốc được giữ nguyên an toàn 100%
let mbcMo = false; let cotETonTai = false; let giaTriCotE = ""; let dsGiaoVien = [];
let trangThaiKhoa = "Mở";

function moRongHienThiDiem(sel) {
    if (sel.hasAttribute('data-dang-thu-gon')) {
        Array.from(sel.options).forEach(opt => {
            let full = opt.getAttribute('data-full');
            if (full) opt.text = full;
        });
        sel.removeAttribute('data-dang-thu-gon');
    }
}
function thuGonHienThiDiem(sel) {
    Array.from(sel.options).forEach(opt => {
        let full = opt.getAttribute('data-full');
        if (full) opt.text = full;
    });
    if (sel.selectedIndex > 0) { 
        let opt = sel.options[sel.selectedIndex];
        let short = opt.getAttribute('data-short');
        if (short) opt.text = short;
        sel.setAttribute('data-dang-thu-gon', 'true');
    } else {
        sel.removeAttribute('data-dang-thu-gon');
    }
}

function kiemTraLaBGH() {
    if (typeof window.PGV_QUYEN !== 'undefined' && (window.PGV_QUYEN === 'xxx' || window.PGV_QUYEN === 'xx')) return true;
    if (typeof canbHientai !== 'undefined' && (canbHientai.quyen === 'xxx' || canbHientai.quyen === 'xx')) return true;
    return false;
}
function kiemTraLaGS() {
    if (typeof window.PGV_QUYEN !== 'undefined' && window.PGV_QUYEN === 'gs') return true;
    if (typeof canbHientai !== 'undefined' && canbHientai.quyen === 'gs') return true;
    return false;
}
function kiemTraQuyenTruyCap() {
    var selectGv = document.getElementById("hopChonGv"); 
    var nutLuu = document.getElementById("nutLuuTam"); 
    var nutNop = document.getElementById("nutNopBcao");
    var diemThuong = document.getElementById("nhapDiemThuong");
    var isBGH = kiemTraLaBGH();
    var isGS = kiemTraLaGS();

    if (cotETonTai && selectGv && selectGv.style.display !== "none") {
        var daChon = selectGv.value && selectGv.value !== "";
        if (daChon) { 
            if (isBGH) {
                if (nutLuu) nutLuu.disabled = false; 
                if (diemThuong) diemThuong.disabled = false;
                if (nutNop) nutNop.disabled = true; 
            } else if (isGS) {
                if (nutLuu) nutLuu.disabled = false; 
                if (nutNop) nutNop.disabled = true; 
                if (diemThuong) diemThuong.disabled = true;
            } else {
                if (nutLuu) nutLuu.disabled = true; 
                if (nutNop) nutNop.disabled = true; 
                if (diemThuong) diemThuong.disabled = true;
                if (typeof hienThongb === 'function') hienThongb('chuy', '⚠️ Bạn đang xem nhật ký của nhân sự khác. Chỉ nhân sự đó hoặc Ban Giám hiệu mới được lưu.'); 
            }
        } else { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        }
    } else { 
        if (window.PGV_IS_SELF || isBGH) { 
            if (nutLuu) nutLuu.disabled = false; 
            if (nutNop && mbcMo) nutNop.disabled = false; 
            if (diemThuong) diemThuong.disabled = false;
        } 
    }

    if (trangThaiKhoa === "Khóa" && diemThuong) {
        diemThuong.disabled = true;
    }
    
    apDungKhoaGiaoDien(); 
}

function khoiTaoDropdownGiaoVien(danhSachGiaoVien) {
    var selectGv = document.getElementById("hopChonGv"); if (!selectGv) return;
    selectGv.innerHTML = '<option value="">-- Lựa chọn hồ sơ --</option>';
    
    var ds = danhSachGiaoVien;
    if (ds && !Array.isArray(ds) && ds.dliu) {
        ds = ds.dliu;
    }
    
    if (ds && ds.length > 0) { 
        var nhomQL = document.createElement("optgroup"); nhomQL.label = "Ban Quản lý";
        var nhomGV = document.createElement("optgroup"); nhomGV.label = "Giáo viên";
        var nhomNV = document.createElement("optgroup"); nhomNV.label = "Nhân viên";
        var nhomKhac = document.createElement("optgroup"); nhomKhac.label = "Khác";

        ds.forEach(function(cb) { 
            var qy = String(cb.quyen || "").trim().toLowerCase();
            
            if (qy === "" || qy === "x" || qy === "xx") {
                var option = document.createElement("option"); 
                option.value = cb.id || cb.ma || cb.ttrg; 
                option.textContent = cb.ten || cb.hoTen || cb.tenn; 
                
                var cv = String(cb.chucvu || "").toLowerCase().trim();
                if (cv === "ql" || cv.includes("quản lý") || cv.includes("quan ly") || cv.includes("hiệu trưởng") || cv.includes("ht")) {
                    nhomQL.appendChild(option);
                } else if (cv === "nv" || cv.includes("nhân viên") || cv.includes("nhan vien")) {
                    nhomNV.appendChild(option);
                } else if (cv === "gv" || cv.includes("giáo viên") || cv.includes("giao vien")) {
                    nhomGV.appendChild(option);
                } else {
                    nhomKhac.appendChild(option);
                }
            }
        }); 

        if (nhomQL.children.length > 0) selectGv.appendChild(nhomQL);
        if (nhomGV.children.length > 0) selectGv.appendChild(nhomGV);
        if (nhomNV.children.length > 0) selectGv.appendChild(nhomNV);
        if (nhomKhac.children.length > 0) selectGv.appendChild(nhomKhac);

        selectGv.style.setProperty('display', 'inline-block', 'important');
        selectGv.disabled = false; 
    } 
    else { 
        selectGv.style.setProperty('display', 'none', 'important'); 
        selectGv.disabled = true; 
    }
}

function xuLyCotE(giaTriE, danhSachGiaoVien) { 
    cotETonTai = true; giaTriCotE = giaTriE; dsGiaoVien = danhSachGiaoVien || []; 
    khoiTaoDropdownGiaoVien(dsGiaoVien); 
    kiemTraQuyenTruyCap(); 
}

function cdang(ptu) { 
    if(!ptu) return;
    ptu.style.height = 'auto'; 
    ptu.style.height = (ptu.scrollHeight) + 'px'; 
}
function gdang(ptu) { ptu.style.height = 'auto'; ptu.style.height = ptu.scrollHeight + 'px'; }
function cgon(ptu, ccao) { ptu.style.height = ccao; ptu.scrollTop = 0; }
function maHoaBcao(chu, tepdk) { let q = (chu || "").trim(); if (tepdk && tepdk.length > 0) { tepdk.forEach(t => { q += ` [FILE:${t.tentep}|${t.duongd}]`; }); } return q; }

function thietLapNutKhoa(trangThai, ngayKhoa = "") {
    let ttKhoa = String(trangThai || "Mở").trim();
    trangThaiKhoa = ttKhoa;
    
    let isBGH = kiemTraLaBGH();
    let isGS = kiemTraLaGS();
    let btnAll = document.getElementById("nutKhoaTatCa");
    let btn = document.getElementById("nutMoKhoa");
    let spanNgay = document.getElementById("hienThiNgayKhoa"); 
    
    if(btnAll) {
        if(isBGH) {
            btnAll.style.setProperty('display', 'inline-block', 'important');
            if (ttKhoa === "Khóa") {
                btnAll.setAttribute("data-tt", "Mở");
                btnAll.className = "btn btn-sm btn-outline-success fw-bold me-3 align-middle btn-reactbits-shiny";
                btnAll.innerHTML = `<i class="bi bi-unlock-fill me-1"></i> Mở tất cả`;
            } else {
                btnAll.setAttribute("data-tt", "Khóa");
                btnAll.className = "btn btn-sm btn-outline-danger fw-bold me-3 align-middle btn-reactbits-shiny";
                btnAll.innerHTML = `<i class="bi bi-lock-fill me-1"></i> Khóa tất cả`;
            }
        } else {
            btnAll.style.setProperty('display', 'none', 'important');
        }
    }

    if (btn) {
        if (isBGH || isGS) {
            btn.style.setProperty('display', 'inline-flex', 'important');
        } else {
            btn.style.setProperty('display', 'none', 'important');
        }
        
        if (ttKhoa === "Khóa") {
            btn.className = "btn btn-success btn-sm fw-bold text-nowrap w-auto d-inline-flex align-items-center btn-reactbits-shiny";
            btn.innerHTML = `<i class="bi bi-unlock-fill me-1"></i> Mở`;
            if (spanNgay) {
                spanNgay.style.setProperty('display', 'inline-flex', 'important');
                spanNgay.innerText = ngayKhoa ? "Đã khoá: " + ngayKhoa : "Đã khoá";
            }
        } else {
            btn.className = "btn btn-danger btn-sm fw-bold text-nowrap w-auto d-inline-flex align-items-center btn-reactbits-shiny";
            btn.innerHTML = `<i class="bi bi-lock-fill me-1"></i> Khóa`;
            if (spanNgay) {
                spanNgay.style.setProperty('display', 'none', 'important');
                spanNgay.innerText = "";
            }
        }
    }
    
    apDungKhoaGiaoDien();
}

function doiTrangThaiKhoa() {
    if (!kiemTraLaBGH() && !kiemTraLaGS()) {
        if (typeof hienThongb === 'function') hienThongb('loi', "⚠️ Đồng chí không có thẩm quyền thao tác nút chức năng này.");
        return;
    }
    
    let maTrangDich = (typeof canbHientai !== 'undefined' && canbHientai && canbHientai.canb) ? canbHientai.canb.ttrg : "";
    if (cotETonTai) { 
        var selectGv = document.getElementById("hopChonGv"); 
        if (selectGv && selectGv.style.display !== "none" && selectGv.value && selectGv.value !== "") { 
            maTrangDich = selectGv.value;
        } 
    }

    if (!maTrangDich || maTrangDich.trim() === "") {

function veBangNviec(db) {

    if (typeof window.PGV_QUYEN !== 'undefined') isXXX = (window.PGV_QUYEN === 'xxx');
    else if (typeof canbHientai !== 'undefined' && canbHientai) isXXX = (canbHientai.quyen === 'xxx');

    const thXoa = $('#bangNviec thead th:last-child');
    if (isXXX) {
        thXoa.show();
    } else {
        thXoa.hide();
    }

    if (!db || db.length === 0) { 
        let colSpBlank = isXXX ? "8" : "7"; 
        bg.html(`<tr><td colspan="${colSpBlank}" class="text-center text-muted py-3 small">Chưa có nhiệm vụ.</td></tr>`); 
        tinhtTdong(); 
        return; 
    }
    
    let mangChuoiHtml = [];

    db.forEach((dong, chs) => {
        let sn = (dong[0] !== null && dong[0] !== undefined && dong[0] !== "") ? dong[0] : "";
        let ndc = dong[1] || ""; let dMax = dong[2] || ""; 
        let tGiao = (dong[3] !== undefined && dong[3] !== null) ? String(dong[3]) : "";
        let tHt   = (dong[5] !== undefined && dong[5] !== null) ? String(dong[5]) : "";
        let lTdo = dong[4] || ""; 
        let nTH = dong[6] || ""; 
        let rawH = dong[7] || ""; 
        let gc = dong[8] || "";
        
        let j_val = dong[9] || ""; let k_val = dong[10] || ""; let l_val = dong[11] || ""; let m_val = dong[12] || "";
        
        let valChon = ""; let valConfig = rawH;
        if(rawH.includes("@@@")) { let p = rawH.split("@@@"); valChon = p[0]; valConfig = p[1]; } 
        else if(!rawH.includes("|") && !rawH.includes(";") && !rawH.includes("\n") && rawH !== "") { valChon = rawH; valConfig = rawH; }
        
        let safeConfig = valConfig.replace(/"/g, '&quot;');
        let isTitle = ndc.trim().startsWith('*');
        let dsp = isTitle ? 'display: none;' : '';
        let fw = isTitle ? 'fw-bold text-primary text-uppercase' : '';
        let colSp = isTitle ? (isXXX ? 'colspan="7"' : 'colspan="6"') : '';

        let vTgGiao = (tGiao.toLowerCase() === "dd/mm/yyyy") ? "" : tGiao;
        let vTgHt   = (tHt.toLowerCase() === "dd/mm/yyyy") ? "" : tHt;

        let htmlDiem = `<input type="text" class="form-control form-control-sm text-center fw-bold chonKq" data-config="${safeConfig}" value="${valChon}" style="color:red; ${dsp}" onchange="tinhtTdong()">`;
        
        if (valConfig.includes("|") || valConfig.includes(";") || valConfig.includes("\n")) {
            let optsArray = [];
            if (valConfig.includes(";")) {
                optsArray = valConfig.split(";");
            } else if (valConfig.includes("\n")) {
                let lines = valConfig.split("\n");
                let currentOpt = "";
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (line === "") continue; 
                    currentOpt = currentOpt === "" ? line : currentOpt + " " + line;
                    if (line.includes("|") || i === lines.length - 1) {
                        optsArray.push(currentOpt);
                        currentOpt = "";
                    }
                }
            } else {
                optsArray = valConfig.split("|");
            }

            let mangGiaTriDiem = [];
            optsArray.forEach(opt => {
                let kv = opt.includes("|") ? opt.split("|") : [opt]; 
                let txt = kv[0].replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim(); 
                let val = kv.length > 1 ? kv[1].replace(/[\r\n]+/g, '').trim() : txt;
                if(txt !== "") {
                    let matchNum = txt.match(/[-+]?\d*\.?\d+/);
                    if (matchNum && kv.length === 1) { val = matchNum[0]; }
                    mangGiaTriDiem.push(val);
                }
            });

            if (valChon !== "" && !mangGiaTriDiem.includes(valChon)) {
                valChon = "";

function phanTichNgayVN(chuoiNgay) {
    if (!chuoiNgay || chuoiNgay.trim() === "") return null;
    let p = chuoiNgay.trim().split('/');
    if (p.length === 3) {
        let d = parseInt(p[0], 10);
        let m = parseInt(p[1], 10);
        let y = parseInt(p[2], 10);
        if (!isNaN(d) && !isNaN(m) && !isNaN(y)) {
            return new Date(y, m - 1, d);
        }
    }
    return null; 
}

function tuDongDinhDangNgayOnBlur(ptu) {
    let giatri = ptu.value.trim().replace(/\D/g, ''); 
    
    if (giatri.length === 8) {
        let ngay = giatri.substr(0, 2);
        let thang = giatri.substr(2, 2);
        let nam = giatri.substr(4, 4);
        ptu.value = ngay + '/' + thang + '/' + nam;
    } 
    else if (giatri.length === 6) {
        let ngay = giatri.substr(0, 2);
        let thang = giatri.substr(2, 2);
        let nam = giatri.substr(4, 2);
        ptu.value = ngay + '/' + thang + '/20' + nam; 
    }
    
    if (typeof tinhtTdong === 'function') {
        tinhtTdong();
    }
}

function moDanhSachDiem(suKien, ptu) {
    if (typeof trangThaiKhoa !== 'undefined' && trangThaiKhoa === "Khóa") return;
    
    let dongHienTai = ptu.closest('tr');
    
    let theTgHt = dongHienTai.querySelector('.nhapTgHt');
    let gtriTgHt = theTgHt ? theTgHt.value.trim() : "";
    
    let ngayHt = phanTichNgayVN(gtriTgHt); 
    
    if (!gtriTgHt || ngayHt === null) {
        if (typeof hienThongb === 'function') {
            hienThongb('cbh', '⚠️ Đồng chí cần nhập đầy đủ và đúng định dạng [Thời gian hoàn thành] (VD: 08/09/2026) trước khi đánh giá kết quả.');
        } else {
            alert('⚠️ Đồng chí cần nhập đầy đủ và đúng định dạng [Thời gian hoàn thành] (VD: 08/09/2026) trước khi đánh giá kết quả.');
        }
        suKien.stopPropagation();
        return; 
    }

    document.querySelectorAll('.khung-danh-sach').forEach(ds => {
        if (ds !== ptu.closest('.vung-chon-diem').querySelector('.khung-danh-sach')) {
            ds.style.display = 'none';
        }
    });
    
    let vungChon = ptu.closest('.vung-chon-diem');
    let danhSach = vungChon.querySelector('.khung-danh-sach');
    
    if (danhSach.style.display === 'none' || danhSach.style.display === '') {
        let theTgGiao = dongHienTai.querySelector('.nhapTgGiao');
        let theTdo = dongHienTai.querySelector('.nhapTdo'); 
        
        let gtriTgGiao = theTgGiao ? theTgGiao.value.trim() : "";
        let gtriTdo = theTdo ? theTdo.value.trim() : ""; 
        
        let ngayGiao = phanTichNgayVN(gtriTgGiao);
        
        let cacMucChon = danhSach.querySelectorAll('.muc-chon');
        let dsGiaTriSo = [];
        
        cacMucChon.forEach((muc, index) => {
            if (index > 0) { 
                let valClick = muc.getAttribute('onclick');
                if (valClick) {
                    let match = valClick.match(/'([^']*)'/); 
                    if (match && match[1]) {
                        let num = parseFloat(match[1]);
                        if (!isNaN(num) && !dsGiaTriSo.includes(num)) {
                            dsGiaTriSo.push(num);
                        }
                    }
                }
            }
        });
        
        dsGiaTriSo.sort((a, b) => a - b);
        let tongSoMuc = dsGiaTriSo.length;
        let xetDieuKien = false;
        let mucToiDaDuocChon = tongSoMuc - 1; 
        
        if (ngayGiao !== null && ngayHt !== null) {
            xetDieuKien = true;
            let timeGiao = Date.UTC(ngayGiao.getFullYear(), ngayGiao.getMonth(), ngayGiao.getDate());
            let timeHt = Date.UTC(ngayHt.getFullYear(), ngayHt.getMonth(), ngayHt.getDate());
            let msMotNgay = 1000 * 60 * 60 * 24;
            
            let khoangCachNgay = (timeGiao - timeHt) / msMotNgay; 
            
            if (khoangCachNgay < 0) {
                let viTriLonHon0 = dsGiaTriSo.findIndex(v => v > 0);
                if (viTriLonHon0 !== -1) {
                    mucToiDaDuocChon = viTriLonHon0;
                } else {
                    mucToiDaDuocChon = 0;
                }
            } else {
                if (gtriTdo !== "") { 
                    if (khoangCachNgay >= 1) {
                        mucToiDaDuocChon = tongSoMuc - 1; 
                    } else if (khoangCachNgay === 0) {
                        mucToiDaDuocChon = Math.max(0, tongSoMuc - 2); 
                    }
                } else {
                    mucToiDaDuocChon = tongSoMuc - 1; 
                }
            }
        }
        
        cacMucChon.forEach((muc, index) => {
            if (index === 0) {
                muc.style.display = 'block'; 
                return;
            }
            if (xetDieuKien && tongSoMuc > 0) {
                let valClick = muc.getAttribute('onclick');
                if (valClick) {
                    let match = valClick.match(/'([^']*)'/);
                    if (match && match[1]) {
                        let num = parseFloat(match[1]);
                        let thuHang = dsGiaTriSo.indexOf(num);
                        
                        if (thuHang > mucToiDaDuocChon) {
                            muc.style.display = 'none'; 
                        } else {
                            muc.style.display = 'block';
                        }
                    }
                }
            } else {
                muc.style.display = 'block';
            }
        });

        danhSach.style.visibility = 'hidden';
        danhSach.style.display = 'block';
        
        let toaDoNut = ptu.getBoundingClientRect();
        let chieuCaoDanhSach = danhSach.getBoundingClientRect().height;
        let vungCuonBang = ptu.closest('.table-responsive');
        let khoangTrongBenDuoi = 0;
        
        if (vungCuonBang) {
            let toaDoVungCuon = vungCuonBang.getBoundingClientRect();
            khoangTrongBenDuoi = toaDoVungCuon.bottom - toaDoNut.bottom;
        } else {
            khoangTrongBenDuoi = window.innerHeight - toaDoNut.bottom;
        }
        
        if (khoangTrongBenDuoi < (chieuCaoDanhSach + 10) && toaDoNut.top > chieuCaoDanhSach) {
            danhSach.style.top = 'auto';
            danhSach.style.bottom = '100%';
            danhSach.style.boxShadow = '0 -4px 8px rgba(0,0,0,0.15)'; 
        } else {
            danhSach.style.top = '100%';
            danhSach.style.bottom = 'auto';
            danhSach.style.boxShadow = '0 4px 8px rgba(0,0,0,0.15)';
        }
        
        danhSach.style.visibility = 'visible';
    } else {
        danhSach.style.display = 'none';
    }
    
    suKien.stopPropagation(); 
}

function kiemTraTatCaRangBuoc(giaTriThuc, chuoiDieuKien) {
    if (!chuoiDieuKien || chuoiDieuKien.trim() === "") return false;
    
    // 1. Chuẩn hóa: Biến mọi dấu phẩy thập phân thành dấu chấm để hệ thống hiểu
    let str = chuoiDieuKien.trim().replace(/,/g, '.'); 
    
    let constraints = [];
    
    // 2. Thay đổi quy tắc: Dùng dấu chấm phẩy (;) hoặc khoảng trắng để ngăn cách điều kiện, KHÔNG dùng dấu phẩy (,) nữa
    if (str.includes(';')) constraints = str.split(';').map(s=>s.trim()).filter(s=>s);
    else if (str.includes(' ')) constraints = str.split(/\s+/).filter(s=>s);
    else constraints = [str];
    
    if (constraints.length === 0) return false;
    
    // 3. Chuẩn hóa giá trị thực tế của giáo viên đạt được
    let numVal = parseFloat(String(giaTriThuc).replace(/,/g, '.').replace(/[^\d.-]/g, ''));
    if (isNaN(numVal)) return false;
    
    // 4. Bắt đầu đối chiếu
    for (let cond of constraints) {
        if (cond.startsWith(">=")) {
            let threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal >= threshold)) return false;
        } else if (cond.startsWith("<=")) {
            let threshold = parseFloat(cond.substring(2).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal <= threshold)) return false;
        } else if (cond.startsWith(">") && !cond.startsWith(">=")) {
            let threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal > threshold)) return false;
        } else if (cond.startsWith("<") && !cond.startsWith("<=")) {
            let threshold = parseFloat(cond.substring(1).replace(/[^\d.-]/g, ''));
            if (isNaN(threshold)) return false;
            if (!(numVal < threshold)) return false;
        } else {
            let exact = parseFloat(cond.replace(/[^\d.-]/g, ''));
            if (isNaN(exact)) return false;
            if (Math.abs(numVal - exact) > 1e-9) return false;
        }
    }
    return true;
}

function debounce(func, wait) {
    let timeout;
    return function(...args) {
        const context = this;
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(context, args), wait);
    };
}

                let diem = parseFloat(valThuc.replace(/,/g, '.'));

                let k = dg.querySelector('.oColK')?.value.trim() || "";
                let l = dg.querySelector('.oColL')?.value.trim() || "";
                let m = dg.querySelector('.oColM')?.value.trim() || "";
                
                if (j !== "" || k !== "" || l !== "" || m !== "") {
                    hasJMLogic = true;
                    let rank = 0;
                    if (kiemTraTatCaRangBuoc(valThuc, j)) rank = 4;
                    else if (kiemTraTatCaRangBuoc(valThuc, k)) rank = 3;
                    else if (kiemTraTatCaRangBuoc(valThuc, l)) rank = 2;
                    else if (kiemTraTatCaRangBuoc(valThuc, m)) rank = 1;
                    if (rank > 0) minRank = Math.min(minRank, rank);
                    else minRank = Math.min(minRank, 1);
                }
            }
        }
    });
    
    // Cộng điểm và triệt tiêu lỗi số lẻ dài của JavaScript (giữ lại tối đa 3 số thập phân)
    let diemCuoiCung = Math.round((tongDiem + dc) * 1000) / 1000;
    let xpl = "Chưa hoàn thành";
    
    if (soNhiemVu === 0) {
        xpl = "Chưa giao việc";
    } else if (soDaDanhGia < soNhiemVu) {
        xpl = "Chưa đánh giá";
    } else {
        // Xếp loại theo mốc điểm tuyệt đối
        let mucDiem = 1; 
        if (diemCuoiCung >= 90) mucDiem = 4; 
        else if (diemCuoiCung >= 70) mucDiem = 3; 
        else if (diemCuoiCung >= 50) mucDiem = 2; 
        
        // So sánh với điểm liệt (Nếu có cột J,K,L,M)
        let mucCuoiCung = mucDiem;
        if (hasJMLogic) {
            mucCuoiCung = Math.min(minRank, mucDiem);
        }

        if (mucCuoiCung === 4) xpl = "Xuất sắc";
        else if (mucCuoiCung === 3) xpl = "Hoàn thành tốt";
        else if (mucCuoiCung === 2) xpl = "Hoàn thành";
        else xpl = "Chưa hoàn thành";
    }
    
    let txtKq = xpl;
    if (soNhiemVu > 0 && soDaDanhGia === soNhiemVu && xpl !== "Chưa giao việc" && xpl !== "Chưa đánh giá") {
        // Chuyển kết quả trở lại thành dấu phẩy khi hiển thị lên giao diện
        let diemHienThi = String(diemCuoiCung).replace('.', ',');
        txtKq = `${xpl}: ${diemHienThi} điểm`;
    }
    
    const qht = document.getElementById('chuKqHthi');
    if (qht) { 
        qht.innerText = txtKq; 
        qht.className = "fw-bold epMotDong"; 
        if (xpl === "Xuất sắc") qht.classList.add("text-success"); 
        else if (xpl.includes("Hoàn thành")) qht.classList.add("text-primary"); 
        else qht.classList.add("text-danger"); 
    }
    
    const theMenuDoc = document.querySelectorAll('#oKetQuaMenuDoc, .oKetQuaMenuDoc, .ketQuaMenuDoc');
    theMenuDoc.forEach(el => {
        el.innerText = txtKq;
        el.className = "epMotDong"; 
        if (xpl === "Xuất sắc") el.classList.add("text-success", "fw-bold"); 
        else if (xpl.includes("Hoàn thành")) el.classList.add("text-primary", "fw-bold"); 
        else el.classList.add("text-danger", "fw-bold"); 
    });
}, 300);

function epKieuKq(kq) {
    if (typeof kq === 'string') {
        try { return JSON.parse(kq); } catch(e) { return { ttai: 'loi', tbao: kq }; }
    }
    return kq;
}

function xulyTaiBcao(ptu) {
    if (typeof trangThaiKhoa !== 'undefined' && trangThaiKhoa === "Khóa") return;
    const files = ptu.files;
    if (!files || files.length === 0) return;
    hienTaiDl("⏳ Đang tải tệp đính kèm lên máy chủ...");
    
    let tepXuLy = 0;
    let mngTep = [];
    let hasError = false;
    
    for (let i = 0; i < files.length; i++) {
        let f = files[i];
        
        if (f.size > 5 * 1024 * 1024) {
            anTaiDl();
            alert("Tệp '" + f.name + "' quá lớn (vượt 5MB). Vui lòng chọn tệp nhỏ hơn.");
            ptu.value = '';
            return;
        }

        let reader = new FileReader();
        reader.onload = function(e) {
            if (hasError) return;
            try {
                let dlBase64 = e.target.result.split(',')[1];
                mngTep.push({ tentep: f.name, kieu: f.type, dliu: dlBase64 });
                tepXuLy++;
                
                if (tepXuLy === files.length) {
                    guiTepLenMayChu(mngTep);
                    ptu.value = ''; 
                }
            } catch (err) {
                hasError = true;
                anTaiDl();
                alert("Lỗi đọc tệp: " + err.message);
                ptu.value = '';
            }
        };
        reader.readAsDataURL(f);
    }
}

function guiTepLenMayChu(mngTep) {
    const xuLyThanhCong = function(kqTho) {
        anTaiDl();
        
        let kq = (typeof kqTho === 'string') ? JSON.parse(kqTho) : kqTho;
        let laThanhCong = (kq.ttai === 'tcong') || Array.isArray(kq);
        
        if (laThanhCong) {
            let duLieuTep = kq.dliu ? kq.dliu : (Array.isArray(kq) ? kq : []);
            
            window.tepdinhkBcao = window.tepdinhkBcao.concat(duLieuTep);
            veDinhKemBcao();
            if (typeof mokBcao === 'function') mokBcao();
            if (typeof hienThongb === 'function') hienThongb('tcong', "Tải tệp thành công!");
        } else {
            let msg = kq.tbao || JSON.stringify(kq);
            if (typeof hienThongb === 'function') hienThongb('loi', "Lỗi tải tệp: " + msg);
        }
    };

    const xuLyLoi = function(loi) {
        anTaiDl();
        if (typeof hienThongb === 'function') hienThongb('loi', "Lỗi kết nối Server: " + (loi.message || loi));
    };

    if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(xuLyThanhCong).withFailureHandler(xuLyLoi).pgv_tai_tepbcao({ teps: mngTep });
    } else if (typeof khachApi !== 'undefined' && khachApi.taiTepBcao) {
        khachApi.taiTepBcao({ teps: mngTep }, xuLyThanhCong, xuLyLoi);
    } else {
        anTaiDl();
        alert("Lỗi hệ thống: API tải tệp chưa được liên kết.");
    }
}

    const vung = document.getElementById('vungDinhkBcao');

    if (!window.tepdinhkBcao || window.tepdinhkBcao.length === 0) return;

$(document).ready(function() {

    if (!originalSelect) return;

    const wrapper = document.createElement("div");
    wrapper.className = "position-relative d-inline-block custom-gv-combobox";

    icon.style.pointerEvents = "none";

    const dropdown = document.createElement("div");
    dropdown.className = "shadow-sm border rounded";
    dropdown.style.display = "none";
    dropdown.style.position = "absolute";
    dropdown.style.top = "100%";
    dropdown.style.right = "0";
    dropdown.style.width = "280px";
    dropdown.style.maxHeight = "300px";
    dropdown.style.overflowY = "auto";
    dropdown.style.backgroundColor = "#ffffff";
    dropdown.style.opacity = "1";
    dropdown.style.zIndex = "9999"; 

    wrapper.appendChild(input);
    wrapper.appendChild(icon);
    wrapper.appendChild(dropdown);

    originalSelect.parentNode.insertBefore(wrapper, originalSelect);

    originalSelect.style.setProperty('position', 'absolute', 'important');
    originalSelect.style.setProperty('opacity', '0', 'important');
    originalSelect.style.setProperty('pointer-events', 'none', 'important');
    originalSelect.style.setProperty('z-index', '-1', 'important');
    originalSelect.style.setProperty('width', '1px', 'important');
    originalSelect.style.setProperty('height', '1px', 'important');
    originalSelect.style.setProperty('margin', '0', 'important');
    originalSelect.style.setProperty('padding', '0', 'important');
    originalSelect.style.setProperty('border', 'none', 'important');

    function buildDropdown() {
        dropdown.innerHTML = "";
        
        const defaultDiv = document.createElement("div");
        defaultDiv.className = "px-2 py-2 border-bottom text-muted fw-bold";
        defaultDiv.style.cursor = "pointer";
        defaultDiv.style.background = "#f8f9fa";
        defaultDiv.innerHTML = '<i class="bi bi-x-circle me-1"></i> Bỏ chọn / Trở về chính mình';
        defaultDiv.onmouseover = () => defaultDiv.style.background = "#e2e6ea";
        defaultDiv.onmouseout = () => defaultDiv.style.background = "#f8f9fa";
        defaultDiv.onmousedown = (e) => { e.preventDefault(); selectOption("", "-- Lựa chọn giáo viên --"); };
        dropdown.appendChild(defaultDiv);

        Array.from(originalSelect.children).forEach(child => {
            if (child.tagName === "OPTGROUP") {
                const groupDiv = document.createElement("div");
                groupDiv.className = "fw-bold bg-light px-2 py-1 text-primary border-bottom";
                groupDiv.style.fontSize = "11px";
                groupDiv.style.textTransform = "uppercase";
                groupDiv.textContent = child.label;
                dropdown.appendChild(groupDiv);

                Array.from(child.children).forEach(opt => {
                    addOptionToDropdown(opt.value, opt.textContent);
                });
            } else if (child.tagName === "OPTION" && child.value !== "") {
                addOptionToDropdown(child.value, child.textContent);
            }
        });
    }

    function addOptionToDropdown(val, text) {
        const optDiv = document.createElement("div");
        optDiv.className = "muc-gv px-3 py-1 border-bottom text-dark";
        optDiv.style.cursor = "pointer";
        optDiv.textContent = text;
        optDiv.dataset.val = val;
        optDiv.onmouseover = () => optDiv.style.background = "#cfe2ff";
        optDiv.onmouseout = () => optDiv.style.background = "transparent";
        optDiv.onmousedown = (e) => { e.preventDefault(); selectOption(val, text); };
        dropdown.appendChild(optDiv);
    }

    function filterDropdown(query) {
        const q = query.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
        const items = dropdown.querySelectorAll(".muc-gv");
        let hasVisible = false;
        items.forEach(item => {
            const text = item.textContent.toLowerCase();
            const textNorm = text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d");
            if (text.includes(q) || textNorm.includes(q)) {
                item.style.display = "block";
                hasVisible = true;
            } else {
                item.style.display = "none";
            }
        });
        
        let noRes = dropdown.querySelector(".khong-kq");
        if (!hasVisible) {
            if (!noRes) {
                noRes = document.createElement("div");
                noRes.className = "khong-kq p-2 text-muted text-center fst-italic";
                noRes.textContent = "Không tìm thấy kết quả phù hợp";
                dropdown.appendChild(noRes);
            } else {
                noRes.style.display = "block";
            }
        } else if (noRes) {
            noRes.style.display = "none";
        }
    }

function selectOption(val, text) {
        originalSelect.value = val;
        input.value = val === "" ? "" : text;
        dropdown.style.display = "none";
        
        // 1. Kích hoạt sự kiện tương thích mạnh với jQuery để đánh thức các hàm bắt sự kiện .change() ở ngoài hệ thống
        if (typeof jQuery !== 'undefined') {
            $(originalSelect).trigger("change");
        } else {
            const event = new Event("change", { bubbles: true });
            originalSelect.dispatchEvent(event);
        }
        
        // 2. KHẮC PHỤC LỖI: Chủ động gọi hàm tải dữ liệu gốc khi người dùng chọn về chính mình (val === "")
        if (val === "") {
            if (typeof hienTaiDl === 'function') hienTaiDl("⏳ Đang tải dữ liệu cá nhân...");
            if (typeof taiDlBdau === 'function') {
                taiDlBdau(); // Hàm tải lại dữ liệu bản thân có sẵn trong hệ thống của đồng chí
            }
        }
    }

    input.addEventListener("keyup", (e) => {
        dropdown.style.display = "block";
        filterDropdown(e.target.value);
    });

    input.addEventListener("focus", () => {
        dropdown.style.display = "block";
        filterDropdown(""); 
        input.select();
    });

    input.addEventListener("blur", () => {
        const selectedOpt = Array.from(originalSelect.options).find(o => o.value === originalSelect.value);
        input.value = (selectedOpt && selectedOpt.value !== "") ? selectedOpt.textContent : "";
        dropdown.style.display = "none";
    });

    const observer = new MutationObserver(function(mutations) {
        let needsRebuild = false;
        mutations.forEach(function(mutation) {
            if (mutation.type === "attributes" && mutation.attributeName === "style") {
                if (originalSelect.style.display === "none") {
                    wrapper.style.setProperty("display", "none", "important");
                } else {
                    wrapper.style.setProperty("display", "inline-block", "important");
                }
            }
            if (mutation.type === "attributes" && mutation.attributeName === "disabled") {
                input.disabled = originalSelect.disabled;
            }
            if (mutation.type === "childList") {
                needsRebuild = true;
            }
        });
        if (needsRebuild) {
            buildDropdown();
            const selectedOpt = Array.from(originalSelect.options).find(o => o.value === originalSelect.value);
            input.value = (selectedOpt && selectedOpt.value !== "") ? selectedOpt.textContent : "";
        }
    });
    
    observer.observe(originalSelect, { attributes: true, childList: true });
    
    buildDropdown();
});
</script>
